function loadCloud(cb) {
  let called = false;
  const done = () => { if (!called) { called = true; cb(); } };  // faqat bir marta
  if (!cloud) return done();
  const keys = ["streak", "lastDay", "xp", "pos", "fullname", ...LESSONS.map(l => "lesson" + l.n)].map(k => "alif_" + k);
  const t = setTimeout(done, 2500);
  try {
    cloud.getItems(keys, (err, vals) => {
      clearTimeout(t);
      if (!err && vals) for (const k in vals) if (vals[k]) { try { mem[k.slice(5)] = JSON.parse(vals[k]); } catch {} }
      done();
    });
  } catch { clearTimeout(t); done(); }
}

  ["🏙️","Shibam","Shibam — «Cho'l Manxetteni». Shahar 16-asrda devor bilan o'ralib, ichida 500 ga yaqin 5–11 qavatli loy uy qurilgan. Bu uylar dunyodagi loydan qurilgan eng qadimgi «osmono'par»lar hisoblanadi. Uylarni yomg'ir yuvib ketmasligi uchun aholi ularni har yili yangi loy bilan suvaydi."],
  ["🌳","Sokotra · ajdar daraxti","Ajdar qoni daraxti soyabonga o'xshab o'sadi — shoxlari tepaga qarab ochilgan. Uning qizil shirasi qadimdan bo'yoq va dori sifatida ishlatilgan. Sokotra oroli asrlar davomida quruqlikdan ajralib turgani uchun bu yerdagi o'simliklarning uchdan biri dunyoning boshqa hech bir joyida o'smaydi."],
  ["🌸","Sokotra · cho'l atirguli","Bu daraxtning tanasi shishadek yo'g'on — u ichida suv to'playdi va qurg'oqchilikda shu suv bilan yashaydi. Qoyalarga yopishib o'sadi, ustida pushti gullar ochiladi. Sokotraga xos bu tur faqat shu orolda uchraydi."],
  ["💧","Ma'rib to'g'oni","Qadimgi Saba davlati miloddan avvalgi 8-asr atrofida ulkan to'g'on qurib, cho'lni bog'-rog'ga aylantirgan. To'g'on taxminan 1000 yildan ortiq ishlagan. Milodiy 6-asrda u buzilib, aholi tarqalib ketgan. Bu voqea — Saba qissasi — Qur'oni karimda ham zikr qilingan."],
  ["👑","Ma'rib · Bilqis ibodatxonasi","«Mahram Bilqis» — Saba malikasi nomi bilan ataladigan qadimiy ibodatxona xarobalari. Undan qumdan chiqib turgan sakkizta baland tosh ustun saqlanib qolgan. Qur'onda Sulaymon alayhissalom va Saba malikasi qissasi bayon qilingan."],
  ["🏜️","Hadramavt vodiysi","Hadramavt — Yaman sharqidagi uzun va keng vodiy. Bu yerda asrlar davomida Shibam, Seyun, Tarim kabi loydan qurilgan shaharlar rivojlangan. Hadramavtliklar savdo bilan Indoneziya, Malayziya va Sharqiy Afrikagacha borgan va u yerlarda islomning tarqalishiga hissa qo'shgan."],
  ["📖","Tarim","Tarim — Hadramavtning ilm shahri, unda 300 dan ortiq masjid borligi aytiladi. Shahar asrlar davomida olimlar va ilm talabalari markazi bo'lgan. Loydan qurilgan Al-Mihdhor masjidi minorasi 50 metrga yaqin ko'tariladi — u loydan qurilgan eng baland minoralardan biri."],
  ["🏯","Seyun saroyi","Seyun shahridagi bu ulkan oppoq saroy Kasiriy sultonlarining qarorgohi bo'lgan. U to'liq loy g'ishtdan qurilgan va ohak bilan oqlangan. Hozir saroyda muzey joylashgan bo'lib, unda Hadramavt tarixiga oid buyumlar saqlanadi."],
  ["🎓","Zabid","Zabid — Yamanning g'arbiy qismidagi qadimiy shahar. 13–15-asrlarda u islom olamidagi mashhur ilm markazlaridan biri bo'lgan, bu yerda 80 dan ortiq madrasa ishlagan. Shaharning eski qismi UNESCO ro'yxatiga kiritilgan."],
  ["🌋","Adan","Adan shahrining eski qismi so'ngan vulqon krateri ichida joylashgan, shuning uchun uni «Krater» deb ham atashadi. Shahar qadimdan Hindiston, Afrika va Arabistonni bog'lovchi muhim dengiz porti bo'lgan. Tog' yonbag'ridagi qadimiy suv havzalari yomg'ir suvini to'plash uchun qurilgan."],
  ["🏖️","Mukalla","Mukalla — Arab dengizi bo'yidagi port shahar. Uning oppoq uylari qoyali tog'larga suyanib, dengizga qarab turadi. Shahar baliqchilik va savdo bilan mashhur, Hadramavtning dengiz darvozasi hisoblanadi."],
  ["🏰","Dor al-Hajar","«Tosh saroy» Sano yaqinidagi Vodiy Dahr'da, ulkan qoya ustiga qurilgan. Saroy besh qavatli bo'lib, qoya bilan bir butun bo'lib ketgandek ko'rinadi. 20-asrda u imom Yahyoning yozgi qarorgohi bo'lgan. Bugun Yamanning eng mashhur ramzlaridan biri."],
  ["🌿","Ibb","Ibb — Yamanning eng ko'p yomg'ir yog'adigan viloyati, shuning uchun uni «Yashil viloyat» deyishadi. Tog' yonbag'irlari zina-zina dalalar bilan qoplangan. Bu yerda bug'doy, qahva va mevalar yetishtiriladi."],
  ["👸","Jibla","Jibla — Ibb yaqinidagi qadimiy shahar. 11-asrda bu yerdan adolatli malika Arvo Yamanni qariyb 50 yil boshqargan. U ilm, yo'l va masjidlar qurilishiga katta e'tibor bergan. Uning nomi bilan atalgan masjid va maqbara hanuz shaharda turibdi."],
  ["⛰️","Kavkaban","Kavkaban — baland tog' cho'qqisiga qurilgan qadimiy qishloq. Qadimda u dushmanlardan himoyalanish uchun qal'a vazifasini o'tagan. Cho'qqidan pastdagi Shibam (Kavkaban) shahri va butun vodiy ko'rinadi."],
  ["🌄","Haraz tog'lari","Haraz — Sano va Hudayda orasidagi baland tog'lar. Tog' yonbag'irlari zina-zina dalalarga aylantirilgan, cho'qqilarida tosh qishloqlar joylashgan. Bu yerda dunyodagi eng qadimgi qahva navlaridan biri yetishtiriladi."],
  ["☕","Moxa","Moxa — Qizil dengiz bo'yidagi port shahar. 15–17-asrlarda dunyodagi deyarli barcha qahva shu port orqali sotilgan. Shuning uchun Yevropada qahva «mokko» deb atalgan — bugungi «mokachino» so'zi ham shundan. Yamanda qahva ichish odati 15-asrdan beri ma'lum."],
  ["🏰","Taiz · Al-Qohira qal'asi","Bu qal'a Sabir tog'i yonbag'rida, Taiz shahri ustida qad ko'targan. U asrlar davomida shaharni himoya qilib kelgan. Qal'adan butun Taiz shahri ko'rinadi."],
  ["🌊","Bob al-Mandab","Bob al-Mandab — Qizil dengizni Adan ko'rfazi bilan bog'laydigan bo'g'oz, Arabiston va Afrika orasida joylashgan. Uning nomi «Ko'z yoshlar darvozasi» degani — qadimda bu yerdan suzish xavfli bo'lgan. Bugun dunyodagi eng gavjum dengiz yo'llaridan biri."],
  ["🌉","Shahara ko'prigi","Bu tosh ko'prik 17-asrda Shahara tog'idagi ikki qishloqni bog'lash uchun chuqur dara ustiga qurilgan. Ko'prikning uzunligi 20 metrga yaqin, ostida yuz metrlab chuqurlik bor. U Yaman me'morlarining mahoratini ko'rsatuvchi noyob inshoot."],
  ["🍯","Sidr asali","Sidr (konor) daraxti gullaridan olinadigan Yaman asali dunyodagi eng qadrli asallardan biri. Asalarichilar qutilarni sidr daraxtlari gullagan vodiylarga ko'chirib yuradi. Bu asal shifobaxsh xususiyatlari bilan mashhur va juda qimmat turadi."],
  // --- 1-bosqich davomi: MISR (24–27-darslar va imtihon) ---
  ["🏛️","Kom Ombo ibodatxonasi","Nil bo'yidagi bu ibodatxona qo'sh qurilgan: ikki xil ilohga bag'ishlangan ikki eshik va ikki zal yonma-yon turadi. Qadimda bu yerda Nil timsohlari muqaddas sanalgan, shuning uchun ibodatxona yonida mumiyolangan timsohlar muzeyi bor."],
  ["🦅","Edfu ibodatxonasi","Edfu — Misrdagi eng yaxshi saqlangan qadimiy ibodatxonalardan biri. U miloddan avvalgi 237–57-yillarda qurilgan. Kirish oldida granitdan yasalgan ulkan lochin haykali turibdi, devorlari esa yozuvlarga to'la."],
  ["✨","Dendera ibodatxonasi","Dendera ibodatxonasining shiftlaridagi ranglar ming yillar o'tsa ham saqlanib qolgan. Bu yerdan mashhur «Dendera zodiaki» — osmon yulduzlari tasvirlangan tosh topilgan, uning asli hozir Parijdagi Luvr muzeyida."],
  ["🕌","Sulton Hasan masjidi","14-asrda qurilgan bu masjid-madrasa Qohiradagi eng ulkan mamluk inshootlaridan biri. Uning to'rt tomonida to'rt mazhab uchun alohida dars ayvonlari bo'lgan. Eshigi balandligi 38 metrga yaqin."],
  ["🗼","Qohira minorasi","1961-yilda qurilgan 187 metrlik minora Nil o'rtasidagi Gezira orolida turibdi. Uning sirti lotos guli shaklida to'r bilan qoplangan. Tepasidan butun Qohira va havo ochiq kunlari Giza ehromlari ham ko'rinadi."],
  // --- A1: IORDANIYA (35) ---
  ["🏛️","Amman qal'asi","Amman markazidagi Jabal al-Qal'a tepaligida 7000 yildan beri odamlar yashab kelgan. Bu yerda Rim davridagi Gerkules ibodatxonasi ustunlari va Umaviylar saroyi xarobalari bor. Tepalikdan butun Amman shahri ko'rinadi."],
  ["🎭","Amman · Rim teatri","2-asrda qurilgan bu teatr 6000 ga yaqin tomoshabinni sig'dirgan. U tog' yonbag'riga o'yib qurilgan, shuning uchun kun bo'yi soya tushib turadi. Hozir ham bu yerda konsert va tadbirlar o'tkaziladi."],
  ["🕌","Qirol Abdulla I masjidi","Ammandagi bu masjid 1989-yilda qurilgan va ko'k mozaikali ulkan gumbazi bilan mashhur. Gumbaz ostida bir vaqtda 3000 ga yaqin kishi namoz o'qiy oladi. Masjid yonida kichik islom muzeyi bor."],
  ["🌈","Amman · Rangli zinapoyalar","Ammanning eski mahallalarida ko'p qavatli zinapoyalar rang-barang qilib bo'yalgan. Shahar yetti tepalik ustida qurilgani uchun bunday zinalar juda ko'p. Ular yoshlar va sayyohlar sevgan joyga aylangan."],
  ["🏜️","Petra · Al-Xazna","«Xazina» deb ataladigan bu bino 2000 yildan ko'proq oldin nabatiylar tomonidan qizil qoyaga o'yib yasalgan. Uning balandligi 40 metrga yaqin. Petra dunyoning yangi 7 mo'jizasidan biri hisoblanadi."],
  ["⛰️","Petra · Ad-Deyr","«Monastir» deb nomlanadigan bu ulkan bino Xaznadan ham kattaroq. Unga yetib borish uchun 800 dan ortiq tosh zinapoyadan ko'tarilish kerak. Tepadan Vodiy Araba manzarasi ochiladi."],
  ["🪨","Petra · As-Siq","Siq — Petraga olib kiradigan 1,2 km uzunlikdagi tor dara. Ba'zi joylarda devorlar 80 metrgacha ko'tariladi, kengligi esa 3 metrga tushadi. Daraning oxirida birdan Xazna ko'rinadi."],
  ["🌄","Vodiy Rum","«Oy vodiysi» deb ataladigan qizil qumli cho'l. Ulkan qumtosh qoyalar va tog'lar ming yillar davomida shamol ta'sirida o'yilgan. Bu yerda Mars haqidagi ko'plab filmlar suratga olingan."],
  ["🌊","O'lik dengiz","O'lik dengiz yer yuzining eng past nuqtasi — dengiz sathidan 430 metr pastda. Suvi juda sho'r, shuning uchun odam unda cho'kmay, suv ustida yotib turadi. Uning loyi shifobaxsh hisoblanadi."],
  ["🐠","Aqaba","Aqaba — Iordaniyaning Qizil dengizdagi yagona porti. Uning iliq suvlarida rang-barang marjon riflari va baliqlar ko'p. Shahar qadimdan savdo va haj yo'lida joylashgan."],
  ["🏛️","Jerash · Oval maydon","Jerash — dunyodagi eng yaxshi saqlangan Rim shaharlaridan biri. Uning oval shaklidagi maydoni atrofida 160 ga yaqin ustun turibdi. Shaharning ustunli asosiy ko'chasi 800 metrga cho'zilgan."],
  ["🚪","Jerash · Hadrian darvozasi","Bu tantanali darvoza 129-yilda imperator Hadrian shaharga tashrif buyurganda qurilgan. Uning balandligi 21 metrga yaqin. Darvoza Jerashning kirish ramzi hisoblanadi."],
  ["🏰","Ajlun qal'asi","12-asrda Salohiddin Ayyubiyning sarkardasi tomonidan salibchilardan himoya uchun qurilgan. Qal'a tog' cho'qqisida turadi va undan Iordan vodiysi ko'rinadi. U temir konlarini ham qo'riqlagan."],
  ["🏯","Karak qal'asi","Karak — Iordaniyadagi eng katta salibchilar qal'alaridan biri, 1140-yillarda qurilgan. Uning ostida uzun tosh yo'laklar va xonalar bor. 1188-yilda qal'ani Salohiddin qo'shini egallagan."],
  ["⛰️","Shavbak qal'asi","Bu qal'a 1115-yilda salibchilar tomonidan baland tepalik ustida qurilgan. U Damashqdan Misrga boradigan savdo yo'lini nazorat qilgan. Qal'a ichida yer osti quduqlari saqlanib qolgan."],
  ["🗺️","Madaba · mozaik xarita","Madabadagi cherkov polida 6-asrga oid mashhur mozaik xarita bor. Unda Quddus, Nil va O'lik dengiz atrofidagi joylar tasvirlangan. Bu hudud xaritalarining eng qadimiylaridan biri."],
  ["🏔️","Nebo tog'i","Bu tog' Muso alayhissalom bilan bog'liq joy sifatida tanilgan. Cho'qqidan havo ochiq kunlari O'lik dengiz, Iordan vodiysi va Quddus atrofi ko'rinadi. Balandligi 700 metrga yaqin."],
  ["🏛️","Umm Qays","Shimoliy Iordaniyadagi qadimiy Gadara shahri xarobalari. Undan Tabariya ko'li va Golan tepaliklari ko'rinadi. Shahar qora bazalt toshdan qurilgan teatri bilan mashhur."],
  ["🎨","Qusayr Amra","8-asrda Umaviylar davrida qurilgan cho'l qasri va hammomi. Uning ichki devorlari va shiftlari rangli rasmlar bilan bezatilgan. Qasr UNESCO ro'yxatiga kiritilgan."],
  ["🏰","Qasr al-Xarana","Cho'l o'rtasida turgan kvadrat shakldagi ikki qavatli qasr. U 710-yil atrofida qurilgan va karvonlar uchun to'xtash joyi bo'lgan deb taxmin qilinadi. Qasrning 60 dan ortiq xonasi bor."],
  ["🗿","Azraq qal'asi","Qora bazalt toshidan qurilgan bu qal'a Rim davridan beri ishlatib kelingan. 1917-yilda bu yerda «Arabistonlik Lourens» qishlagan. Qal'aning tosh eshigi bir necha tonna keladi."],
  ["🌊","Vodiy Mujib","O'lik dengizga quyiladigan daryo hosil qilgan chuqur va tor dara. Bu dunyodagi eng past joydagi tabiat qo'riqxonasi. Sayohatchilar dara ichidan suv bo'ylab yurib o'tishadi."],
  ["🌿","Dana qo'riqxonasi","Iordaniyaning eng katta tabiat qo'riqxonasi. Bu yerda tog'lar, qumtosh qoyalar va cho'l bir joyda uchrashadi. Unda 800 dan ortiq o'simlik turi o'sadi."],
  ["♨️","Ma'in issiq buloqlari","Tog' orasidagi bu joyda issiq suv sharsharalardan oqib tushadi. Suvning harorati 60 darajagacha yetadi. Qadimdan bu buloqlar shifobaxsh deb hisoblangan."],
  ["🏞️","Iordan daryosi","Iordan daryosi Tabariya ko'lidan O'lik dengizgacha oqadi. Daryo bo'yidagi vodiy Iordaniyaning eng unumdor yerlaridan. Mamlakat nomi ham shu daryodan olingan."],
  ["🏛️","Pella","Iordan vodiysidagi qadimiy shahar, unda 6000 yildan ortiq vaqt davomida odamlar yashagan. Xarobalar orasida qadimiy cherkovlar va uylar qoldiqlari bor. Shahar bulog'i bilan mashhur."],
  ["🧱","Umm al-Jimal","«Qora vohasi» deb ataladigan bu qadimiy shahar qora bazalt toshdan qurilgan. Uylarining ba'zilari hanuz ikki-uch qavatligicha turibdi. Shahar Rim va Vizantiya davrida gullagan."],
  ["🏘️","As-Salt","Salt — Ammandan oldin Iordaniyaning eng muhim shahri bo'lgan. Uning tepalikdagi sariq tosh uylari 19-asrda qurilgan. Salt 2021-yilda UNESCO ro'yxatiga kiritilgan."],
  ["🏛️","Qasr al-Mushatta","Umaviylar davrida qurila boshlagan, lekin tugallanmay qolgan ulkan saroy. Uning nafis o'ymakor tosh devorining bir qismi hozir Berlindagi muzeyda saqlanadi. Saroy Amman aeroporti yaqinida joylashgan."],
  ["♨️","Afra issiq buloqlari","Tafila viloyatidagi tog' darasi ichida joylashgan issiq buloqlar. Bu yerda 15 dan ortiq buloq bor. Suv qoya yoriqlaridan chiqib, kichik hovuzlarga oqib tushadi."],
  ["🪨","Kichik Petra","Bayda hududidagi bu joy Petraning «kichik ukasi» deb ataladi. U ham qoyaga o'yilgan binolardan iborat. Qadimda bu yerda karvonlar to'xtagan."],
  ["🦩","Azraq vohasi","Cho'l o'rtasidagi bu suvli botqoqlik qushlar uchun muhim to'xtash joyi. Har yili ko'chib yuruvchi minglab qushlar shu yerda dam oladi. Voha qo'riqxonaga aylantirilgan."],
  ["🏺","Iordaniya muzeyi","Ammandagi bu muzeyda mamlakatning eng qadimiy topilmalari saqlanadi. Ular orasida 9000 yillik Ayn G'azol haykalchalari va O'lik dengiz qo'lyozmalari bor. Muzey 2014-yilda ochilgan."],
  ["🏰","Aqaba qal'asi","Mamluklar davrida, 16-asrda qurilgan qal'a. U haj karvonlari uchun to'xtash joyi bo'lgan. 1917-yilda bu yerda Arab qo'zg'oloni bilan bog'liq muhim voqealar bo'lgan."],
  ["🕌","Qirol Husayn masjidi","Ammandagi eng katta masjidlardan biri, 2005-yilda qurilgan. Uning oq toshli devorlari va oltin rangli gumbazlari uzoqdan ko'rinib turadi. Masjid shaharning eng baland nuqtalaridan birida joylashgan."],
];

const UZJOY = {
  b0: ["Minorai Kalon", "1127-yilda Arslonxon qurdirgan, balandligi qariyb 46 metr. Asrlar davomida karvonlarga mayoq bo'lgan. Rivoyatga ko'ra, Chingizxon unga qarab bosh egilgan va uni buzdirmagan."],
  b1: ["Ark qal'asi", "Buxoro amirlarining qarorgohi bo'lgan qadimiy qal'a. Uning devorlari shahar ustida tepalikka o'xshab turadi, ichida saroy, masjid va zindon bo'lgan."],
  b2: ["Labi Hovuz", "\"Hovuz bo'yi\" degani. 1620-yilda qazilgan hovuz atrofida madrasa va xonaqoh joylashgan, chetida asrlik tut daraxtlari o'sadi. Buxoroliklarning sevimli dam olish joyi."],
  b3: ["Chor Minor", "\"To'rt minora\" degani. 1807-yilda boy savdogar qurdirgan, har bir minorasi boshqacha bezatilgan — ular to'rt qizining yoki to'rt dinning ramzi deyiladi."],
  b4: ["Somoniylar maqbarasi", "X asrda qurilgan, O'rta Osiyodagi eng qadimiy saqlangan pishiq g'ishtli binolardan biri. G'ishtlari kun davomida yorug'likka qarab rangini o'zgartirgandek ko'rinadi."],
  b5: ["Mir Arab madrasasi", "XVI asrda qurilgan, ko'k gumbazlari Minorai Kalon yonida turadi. Sovet davrida ham ishlab turgan kam sonli madrasalardan biri."],
  b6: ["Kalon masjidi", "Buxoroning eng katta jome masjidi, hovlisiga 10 mingdan ortiq kishi sig'adi. Atrofida 288 ta gumbaz bor."],
  b7: ["Bolo Hovuz masjidi", "1712-yilda qurilgan. Old ayvonidagi 20 ta baland yog'och ustun hovuz suvida aks etib, 40 ta ustunga o'xshaydi."],
  b8: ["Toqi Zargaron", "\"Zargarlar gumbazi\" — XVI asrdagi savdo gumbazlaridan biri. Qadimda bu yerda zargarlar ishlagan, hozir ham hunarmandlar o'z buyumlarini sotadi."],
  b9: ["Ulug'bek madrasasi (Buxoro)", "1417-yilda Mirzo Ulug'bek qurdirgan. Eshigiga \"Ilm olish har bir musulmon erkak va ayolga farzdir\" degan hadis yozilgan."],
  b10: ["Chashmai Ayub", "Rivoyatga ko'ra, Ayyub payg'ambar asosini urib, shu yerdan buloq chiqargan. Hozir bu yerda suv muzeyi bor."],
  b11: ["Sitorai Mohi Xosa", "\"Oy va yulduzdek saroy\" — oxirgi Buxoro amirining yozgi saroyi. Unda Sharq va Yevropa uslublari aralashib ketgan."],
  b12: ["Nodir Devonbegi madrasasi", "Labi Hovuz yonida, peshtoqida quyosh yuzli va oq kiyiklarni changallagan ikki qush tasvirlangan — bu juda kam uchraydigan bezak."],
  b13: ["Bahouddin Naqshband majmuasi", "Mashhur so'fiy olim Bahouddin Naqshband yotgan joy. \"Dil ba yoru, dast ba kor\" — \"Qalb Allohda, qo'l ishda\" degan shiori mashhur."],
  b14: ["Magoki Attori masjidi", "Buxorodagi eng qadimiy masjidlardan biri, yer sathidan ancha pastda joylashgan — chunki asrlar davomida atrofidagi yer ko'tarilib ketgan."],
  s0: ["Registon maydoni", "\"Qumli joy\" degani. Uch ulkan madrasa — Ulug'bek, Sherdor va Tillakori — bir maydonga qarab turadi. Samarqandning yuragi."],
  s1: ["Sherdor madrasasi", "1636-yilda qurilgan. Peshtoqida kiyikni quvayotgan sher va quyosh tasvirlangan — shuning uchun \"Sherdor\" deyiladi."],
  s2: ["Tillakori madrasasi", "\"Tilla bilan bezatilgan\" degani. Ichki masjidining gumbazi va devorlari oltin suvi bilan bezatilgan."],
  s3: ["Ulug'bek madrasasi (Samarqand)", "1420-yilda qurilgan. Bu yerda Ulug'bekning o'zi falakiyot va matematikadan dars bergan."],
  s4: ["Go'ri Amir", "Amir Temur va uning avlodlari dafn etilgan maqbara. Qovurg'ali ko'k gumbazi butun dunyoga mashhur."],
  s5: ["Bibixonim masjidi", "Amir Temur Hindiston yurishidan keyin qurdirgan ulkan jome masjid. O'z davrida dunyodagi eng katta masjidlardan biri bo'lgan."],
  s6: ["Shohi Zinda", "\"Tirik shoh\" degani. Ko'k koshinlar bilan bezatilgan maqbaralar ko'chasi — dunyodagi eng chiroyli koshinkorlik namunalaridan biri."],
  s7: ["Ulug'bek rasadxonasi", "1420-yillarda qurilgan. Bu yerda Ulug'bek 1018 ta yulduzning o'rnini aniqlagan, yil uzunligini juda aniq hisoblagan."],
  s8: ["Siyob bozori", "Samarqandning eng katta va qadimiy bozori. Mashhur Samarqand noni, quritilgan mevalar va shirinliklar shu yerda sotiladi."],
  s9: ["Afrosiyob", "Qadimiy Samarqand shahrining xarobalari, 2500 yildan ortiq tarixga ega. Muzeyida VII asrga oid devoriy rasmlar saqlanadi."],
  s10: ["Hazrati Xizr masjidi", "Afrosiyob tepaligida joylashgan, shaharning eng qadimiy masjid joylaridan biri. O'ymakor yog'och ustunli ayvoni bor."],
  s11: ["Imom Buxoriy majmuasi", "Hadis ilmining buyuk olimi Imom Buxoriy shu yerda dafn etilgan. U yozgan \"Sahihi Buxoriy\" eng ishonchli hadis kitobi hisoblanadi."],
  s12: ["Ruhobod maqbarasi", "XIV asrda qurilgan, Samarqanddagi eng qadimiy saqlangan binolardan biri. Uning ichida payg'ambar sochi saqlangan, deyiladi."],
  s13: ["Oqsaroy maqbarasi", "Go'ri Amir yaqinidagi temuriylar maqbarasi. Ichki gumbazi oltin naqshlar bilan bezatilgan."],
  s14: ["Konigil qog'oz ustaxonasi", "Bu yerda Samarqand qog'ozi hali ham qadimiy usulda tut po'stlog'idan qo'lda tayyorlanadi. Samarqand qog'ozi bir paytlar dunyoga mashhur bo'lgan."],
  s15: ["Doniyor maqbarasi", "Rivoyatga ko'ra, Doniyor payg'ambar shu yerda yotadi. Maqbara 18 metr uzunlikda bo'lib, tepalik ustida joylashgan."],
  x0: ["Ichan qal'a", "Xivaning devor bilan o'ralgan ichki shahri. Ichida 50 dan ortiq tarixiy bino bor — butun shahar ochiq osmon ostidagi muzeyga o'xshaydi."],
  x1: ["Kalta Minor", "Muhammad Aminxon dunyodagi eng baland minorani qurmoqchi bo'lgan, lekin xon vafot etib, minora chala qolgan. Shuning uchun \"kalta\" deyiladi."],

  x6: ["Toshhovli saroyi", "\"Tosh hovli\" degani. 150 dan ortiq xonasi va 9 ta hovlisi bor, devorlari ko'k-oq koshinlar bilan bezatilgan."],
  x7: ["Muhammad Aminxon madrasasi", "Xivaning eng katta madrasasi, 125 ta hujrasi bor. Hozir uning ichida mehmonxona joylashgan."],
  x8: ["Ota darvoza", "Ichan qal'aning g'arbiy asosiy darvozasi. Sayohatchilar Xivaga ko'pincha shu darvozadan kirishadi."],

  b17: ["Abdulazizxon madrasasi", "1652-yilda qurilgan, ichki bezaklari juda boy — ganch va koshinlarda gullar, bulutlar va hatto qushlar tasvirlangan."],
  b18: ["Ko'kaldosh madrasasi", "Buxorodagi eng katta madrasa, XVI asrda qurilgan. Labi Hovuz ansamblining bir qismi."],
  b19: ["Chor Bakr", "Buxoro yaqinidagi \"o'liklar shahri\" — Juybor shayxlari maqbaralari ko'chalar va hovlilar shaklida qurilgan."],
  b20: ["Zindon", "Ark yonidagi amirlik qamoqxonasi. Uning ichida \"Kanalar chuquri\" deb atalgan dahshatli chuqur bo'lgan."],
  b21: ["Registon (Buxoro)", "Ark oldidagi katta maydon. Qadimda bu yerda bayramlar, karvonlar kutib olish va sudlar bo'lgan."],
  b22: ["Fayzulla Xo'jayev uyi", "XIX asr boy savdogarining uyi. Xonalaridagi rangli ganch va yog'och o'ymakorligi Buxoro uy bezagining eng yaxshi namunasi."],
  b23: ["Buxoro hunarmandlari", "Buxoro zardo'zlik, misgarlik va pichoqsozlik bilan mashhur. Ustaxonalarda bu hunarlar avloddan avlodga o'tib kelmoqda."],
  b24: ["Buxoro gilamlari", "Buxoro gilamlari to'q qizil rangi va takrorlanuvchi naqshlari bilan dunyoga tanilgan."],
  b25: ["Xo'ja Zayniddin masjidi", "XVI asr masjidi, ichida koshinkor mehrob va chiroyli ayvon bor. Oldida kichik hovuz joylashgan."],
  b26: ["Ismoil Somoniy bog'i", "Somoniylar maqbarasi atrofidagi katta bog'. Buxoroliklarning sayr qiladigan sevimli joyi."],
  b27: ["Buxoro qal'a devorlari", "Shaharni o'rab turgan qadimiy devor uzunligi 12 km bo'lgan, 11 ta darvozasi bor edi. Ba'zi qismlari hozirgacha saqlangan."],
  b28: ["Talipoch darvozasi", "Buxoroning saqlanib qolgan shahar darvozalaridan biri. Ikki baland burji bilan qadimiy shaharga kirishni eslatadi."],
  b29: ["Varaxsha", "Buxoro yaqinidagi qadimiy shahar xarobalari. Bu yerdan VII–VIII asrga oid devoriy rasmlar topilgan."],
  b30: ["Poykent", "\"Savdogarlar shahri\" deb atalgan qadimiy shahar. Buyuk ipak yo'lidagi muhim to'xtash joyi bo'lgan."],
  b31: ["Raboti Malik", "XI asr karvonsaroyi xarobasi. Peshtoqining ulkan qismi hozirgacha cho'l o'rtasida turibdi."],
  b32: ["Sardoba", "Cho'ldagi gumbazli suv omborlari. Karvonlar yo'lida yomg'ir va qor suvini to'plab, yozda ham salqin saqlagan."],
  b33: ["Buxoro tuya karvoni", "Buxoro Buyuk ipak yo'lining eng muhim shaharlaridan biri edi. Karvonlar shu yerdan Xitoy va Yevropaga yo'l olgan."],
  b34: ["Mavlono Sharif masjidi", "Buxorodagi kichik, ammo eski mahalla masjidlaridan biri. Har bir mahallada o'z masjidi va hovuzi bo'lgan."],
  b35: ["Gaziyon madrasasi", "Buxoroning eski mahallalaridagi madrasalardan biri. Shaharda bir paytlar 100 dan ortiq madrasa bo'lgan."],
  b36: ["Ark muzeyi", "Ark ichidagi muzeyda Buxoro amirlarining kiyimlari, tangalari, qurollari va qadimiy kitoblari saqlanadi."],
  b37: ["Labi Hovuz choyxonasi", "Hovuz bo'yidagi choyxonalarda odamlar asrlar davomida choy ichib, suhbat qurgan. Bu yerda Xo'ja Nasriddinning haykali ham bor."],
  b38: ["Xo'ja Nasriddin haykali", "Eshakka mingan mashhur hazilkash Xo'ja Nasriddin haykali Labi Hovuz yonida turadi. Uning latifalari butun Sharqqa tarqalgan."],
  b39: ["Buxoro non pishirish", "Buxoro tandirida yopilgan non qadimiy usulda pishiriladi. Non o'zbeklarda eng muqaddas ne'mat sanaladi."],
  b40: ["Buxoro zardo'zligi", "Oltin va kumush ip bilan tikiladigan zardo'zlik Buxoroning eng mashhur hunari. Amirlar kiyimlari shunday tikilgan."],
  b41: ["Kogon", "Buxoro yonidagi shahar, temir yo'l qurilganda paydo bo'lgan. U yerda amir saroyi ham bo'lgan."],
  b42: ["Buxoro kechasi", "Kechqurun yoritilgan Minorai Kalon va madrasalar shaharni ertak manzarasiga aylantiradi."],
  s16: ["Registon kechasi", "Kechalari Registon maydonida yorug'lik va ovoz shoulari bo'ladi. Madrasalar devorlari rangli nurlarga burkanadi."],
  s17: ["Amir Temur haykali", "Samarqand markazida Amir Temurning taxtda o'tirgan haykali turadi."],
  s18: ["Samarqand noni", "Samarqand noni o'zining ta'mi va uzoq buzilmasligi bilan mashhur. Rivoyatga ko'ra, uni boshqa shaharda pishirsa, xuddi shunday chiqmaydi."],
  s19: ["Bibixonim maqbarasi", "Bibixonim masjidi qarshisidagi kichik maqbara. Rivoyatga ko'ra, bu yerda Amir Temurning xotini yotadi."],
  s20: ["Xo'ja Abdi Darun", "Samarqanddagi eski ziyoratgoh, hovlisida katta hovuz va qadimiy chinorlar bor."],
  s21: ["Xo'ja Ahror Vali majmuasi", "Mashhur so'fiy olim Xo'ja Ahror Valining majmuasi. Uning madrasasi koshinlari juda chiroyli."],
  s22: ["Chorsu (Samarqand)", "Registon yonidagi gumbazli savdo binosi. Hozir unda san'at galereyasi joylashgan."],
  s23: ["Ishratxona maqbarasi", "XV asrda qurilgan temuriy ayollar maqbarasi. Hozir yarim xaroba, lekin ichki bezaklari hali saqlangan."],
  s24: ["Abdi Birun", "Samarqand chetidagi eski ziyoratgoh, mahalliy aholining dam olish joyi."],
  s25: ["Samarqand ipagi", "Samarqand atrofida qadimdan ipak to'qilgan. Xonatlas va adras matolari shu yerda qo'lda to'qiladi."],
  s26: ["Samarqand qog'oz bozori", "Samarqand qog'ozi bir paytlar Yevropa va Arab dunyosiga yuborilgan. Uni tayyorlash sirlari Xitoydan kelgan."],
  s27: ["Amir Temur maqbarasi gumbazi", "Go'ri Amir gumbazi qovurg'ali shaklda bo'lib, 64 ta qovurg'adan iborat. Ichki devorlar oltin bilan bezatilgan."],
  s28: ["Ulug'bek sekstanti", "Rasadxonaning yer ostidagi ulkan yoyi saqlanib qolgan. U yulduzlarni o'lchash uchun ishlatilgan."],
  s29: ["Shahrisabz · Oqsaroy", "Amir Temurning tug'ilgan shahri Shahrisabzdagi ulkan saroy xarobasi. Peshtoq qoldiqlari 38 metr balandlikda turibdi."],
  s30: ["Shahrisabz · Ko'k gumbaz", "Ulug'bek otasi sharafiga qurdirgan jome masjid, ko'k gumbazi uzoqdan ko'rinadi."],
  s31: ["Shahrisabz · Dor ut-Tilovat", "Amir Temur avlodlari dafn etilgan majmua. Bu yerda Temur o'zi uchun tayyorlagan qabr ham bor."],
  s32: ["Shahrisabz · Amir Temur haykali", "Shahrisabz markazida Amir Temurning tik turgan haykali bor."],
  s33: ["Urgut bozori", "Samarqand yaqinidagi tog' shahri Urgutning katta bozori. Bu yerda qo'lda tikilgan so'zanalar sotiladi."],
  s34: ["Urgut chinorlari", "Urgutda 1000 yildan ortiq yashagan ulkan chinorlar o'sadi. Ularning tanasi ichida odam sig'adi."],
  s35: ["Zarafshon daryosi", "\"Oltin sochuvchi\" degani. Samarqand vohasini shu daryo suvi bilan sug'oriladi."],
  s36: ["Omonqo'ton", "Samarqand yaqinidagi tog' darasi. Bu yerdan tosh davri odamlarining izlari topilgan."],
  s37: ["Panjikent yo'li", "Samarqanddan Panjikentga yo'l Zarafshon vodiysi bo'ylab o'tadi. Qadimgi So'g'd madaniyati shu vodiyda gullagan."],
  s38: ["Samarqand vino uzumi", "Samarqand vohasi uzum bog'lari bilan mashhur. Kishmish va mayiz shu yerdan butun dunyoga yuboriladi."],
  s39: ["Samarqand qandolatchiligi", "Samarqand bozorlarida navvot, parvarda va holva kabi milliy shirinliklar sotiladi."],
  s40: ["Mirzo Ulug'bek", "Ulug'bek Amir Temurning nabirasi, ham hukmdor, ham buyuk olim edi. Uning yulduzlar jadvali Yevropada ham o'rganilgan."],
  s41: ["Samarqand universiteti", "Samarqand davlat universiteti O'zbekistonning eng qadimiy universitetlaridan biri, 1927-yilda ochilgan."],
  s42: ["Buyuk ipak yo'li", "Samarqand Buyuk ipak yo'lining markazi bo'lgan. Bu yerda Xitoy, Hindiston, Eron va Yevropa savdogarlari uchrashgan."],
  s43: ["Samarqand ko'k koshinlari", "Temuriylar davri koshinlari ko'k va feruza ranglari bilan mashhur. Ustalar ularni maxsus pechlarda pishirgan."],
  s44: ["Kafirqal'a", "Samarqand yaqinidagi qadimiy qal'a xarobasi. Bu yerdan So'g'd davriga oid yozuvlar topilgan."],
  s45: ["Samarqand bog'lari", "Amir Temur Samarqand atrofida ko'plab bog'lar — Bog'i Dilkusho, Bog'i Chinor kabilarni bunyod qilgan."],
  s46: ["Samarqand kechki manzarasi", "Kechqurun Samarqand gumbazlari quyosh nurida oltindek tovlanadi."],
  s47: ["Samarqand — Sharq gavhari", "Samarqand 2750 yildan ortiq tarixga ega. Uni \"Sharq gavhari\" va \"Yer yuzining sayqali\" deb atashgan."],
  x12: ["Sayid Allovuddin maqbarasi", "Xivadagi eng qadimiy saqlangan binolardan biri, XIV asrga oid. Ichidagi qabr toshi koshinlar bilan bezatilgan."],
  x13: ["Shergʻozixon madrasasi", "1719-yilda qurilgan, Xivaning eng eski madrasalaridan. Bu yerda shoir Maxtumquli ham o'qigan."],
  x14: ["Oq masjid", "Xivadagi kichik oq masjid, Polvon darvoza yonida joylashgan."],
  x15: ["Polvon darvoza", "Ichan qal'aning sharqiy darvozasi. Darvoza ostidagi yo'lak bir paytlar qul bozori bo'lgan."],
  x16: ["Bog'cha darvoza", "Ichan qal'aning shimoliy darvozasi, bog'lar tomonga ochilgan."],
  x17: ["Tosh darvoza", "Ichan qal'aning janubiy darvozasi, toshdan qurilgan."],
  x18: ["Ichan qal'a devorlari", "Ichan qal'ani o'rab turgan devor 2 km dan uzun va 10 metrgacha baland. Kechqurun devor ustida quyosh botishini kuzatish mumkin."],
  x19: ["Xiva yog'och o'ymakorligi", "Xiva ustalari yog'och eshik va ustunlarni nozik naqshlar bilan o'ygan. Juma masjidi ustunlari bunga eng yaxshi misol."],
  x20: ["Xiva koshinlari", "Xiva koshinlari asosan ko'k va oq ranglarda bo'ladi. Toshhovli saroyining devorlari shunday koshinlar bilan qoplangan."],
  x21: ["Xorazm suzanasi", "Xorazm ayollari kiyim va uy uchun naqshli kashtalar tikadi. Har bir naqshning o'z ma'nosi bor."],
  x22: ["Xorazm lazgisi", "Lazgi — Xorazmning qadimiy raqsi. U 2019-yilda YUNESKO nomoddiy merosi ro'yxatiga kiritilgan."],
  x23: ["Xorazm shivit oshi", "Shivit oshi — ukrop qo'shilgan yashil lag'mon. Bu taom faqat Xorazmda shunday pishiriladi."],
  x24: ["Urganch", "Xorazm viloyatining markazi. Ko'chalarida Xorazm tarixini eslatuvchi haykallar bor."],
  x25: ["Ko'hna Urganch", "Xorazmshohlar davlatining poytaxti bo'lgan qadimiy shahar. Uning Qutlug' Temur minorasi O'rta Osiyodagi eng balandlaridan."],
  x26: ["Ayozqal'a", "Qizilqum cho'li chetidagi qadimiy qal'alar. Tepalik ustida turgan devorlar 2000 yildan ortiq qadimiy."],
  x27: ["Tuproqqal'a", "Qadimgi Xorazm podsholarining saroyi bo'lgan. Bu yerdan devoriy rasmlar va yozuvlar topilgan."],
  x28: ["Qizilqal'a", "Qadimgi Xorazm qal'alaridan biri. To'rtburchak shakli va qalin devorlari yaxshi saqlangan."],
  x29: ["Amudaryo", "O'rta Osiyoning eng katta daryosi. Xorazm vohasi minglab yillardan beri shu daryo suvi bilan yashaydi."],
  x30: ["Xorazm qovuni", "Xorazm qovunlari shirinligi bilan mashhur. Qadimda ularni hatto Bag'dod xalifalariga sovg'a qilib yuborishgan."],
  x31: ["Al-Xorazmiy", "Buyuk olim Muhammad al-Xorazmiy shu yurtdan chiqqan. \"Algoritm\" so'zi uning ismidan, \"algebra\" esa uning kitobidan kelib chiqqan."],
  x32: ["Al-Xorazmiy haykali", "Xiva darvozasi oldida Al-Xorazmiyning katta haykali turadi."],
  x33: ["Abu Rayhon Beruniy", "Buyuk olim Beruniy ham Xorazmdan. U Yerning aylanasini o'lchagan va 150 dan ortiq kitob yozgan."],
  x34: ["Xiva kechasi", "Kechqurun yoritilgan Kalta Minor va Islomxo'ja minorasi Xivani ertakdagi shaharga aylantiradi."],
  x35: ["Xiva — ochiq muzey", "Ichan qal'a 1990-yilda O'zbekistonda birinchi bo'lib YUNESKO jahon merosi ro'yxatiga kiritilgan."],

const starsOf =(s, t) => s / t >= 0.9 ? 3 : s / t >= 0.6 ? 2 : 1;
// xaritadagi tugunlarni egri nuqtali yo'l bilan ulash
function drawTrail() {
  const map = $.querySelector(".map"); if (!map) return;
  const svgEl = map.querySelector(".trail"), r = map.getBoundingClientRect();
  const pts = [...map.querySelectorAll(".node")].map(n => { const b = n.getBoundingClientRect(); return [b.left - r.left + b.width / 2, b.top - r.top + b.height / 2]; });
  svgEl.setAttribute("viewBox", `0 0 ${r.width} ${r.height}`);
  let d = pts.length ? `M${pts[0]}` : "";
  for (let k = 1; k < pts.length; k++) { const [a, b] = [pts[k - 1], pts[k]], my = (a[1] + b[1]) / 2; d += ` C${a[0]},${my} ${b[0]},${my} ${b[0]},${b[1]}`; }
  const doneN = map.querySelectorAll(".node.won").length;
  let dd = pts.length > 1 ? `M${pts[0]}` : "";
  for (let k = 1; k <= Math.min(doneN, pts.length - 1); k++) { const [a, b] = [pts[k - 1], pts[k]], my = (a[1] + b[1]) / 2; dd += ` C${a[0]},${my} ${b[0]},${my} ${b[0]},${b[1]}`; }
  svgEl.innerHTML = `<path d="${d}" class="t-all"/>${doneN ? `<path d="${dd}" class="t-done"/>` : ""}`;
}
window.addEventListener("resize", () => mode === "home" && drawTrail());
function confetti(n = 40) {
  const box = document.createElement("div"); box.className = "confetti";
  for (let k = 0; k < n; k++) box.innerHTML += `<i style="left:${Math.random() * 100}%;background:${["#c9a227", "#f3dc8f", "#0f6b45", "#003a24"][k % 4]};animation-delay:${(Math.random() * .6).toFixed(2)}s;transform:rotate(${Math.random() * 360}deg)"></i>`;
  document.body.appendChild(box); setTimeout(() => box.remove(), 3200);
}

      <div class="big ar" style="margin:14px 0 4px">${w.ar}</div>${w.pl ? `<div class="ar" style="opacity:.7">ج: ${w.pl}</div>` : ""}

    $.querySelector("#lx").onclick = yopish; $.querySelector("#pl").onclick = () => say(w.ar); setTimeout(() => say(w.ar), 300);
    $.querySelector("#nx").onclick = () => { if (++i < W.length) card(); else { i = 0; quiz(); } };

      const ok = o[+b.dataset.k] === w; if (ok) ball++; else Q.push({ w, t });  // xato — oxirida yana so'raladi
      $.querySelectorAll(".opts button").forEach((x, k) => { x.disabled = true; if (o[k] === w) x.classList.add("ok"); });
      if (!ok) b.classList.add("bad");
      const fb = $.querySelector("#fb"); fb.className = "fb " + (ok ? "ok" : "bad"); fb.textContent = ok ? "To'g'ri!" : `To'g'risi: ${w.ar} — ${w.uz}`;

    $.innerHTML = `<h2>Barakalla!</h2><div class="video">📚<br>${W.length} ta so'z o'rganildi<br>+${ball} ⭐</div>

          <span class="pe">${AI[placeOf(k)] ? `<img class="pcol" src="${AI[placeOf(k)]}" alt="">` : MAP_COLOR && (FOTO[placeOf(k)] || []).length ? `<img class="pcol" src="${FOTO[placeOf(k)][0]}" alt="" loading="lazy">` : sketch(placeOf(k))}</span><b>!</b></button>`}</div>`;
    }).join("")}</div>`}`;
  drawTrail();
  $.querySelectorAll("button.st:not(.done)").forEach(b => b.onclick = () => { stage = +b.dataset.s; render(); });
  $.querySelectorAll("button.back").forEach(b => b.onclick = () => { if (b.classList.contains("lvback") && !(level >= 1)) level = null; stage = null; bolim = null; render(); });
  $.querySelectorAll("button.node:not([disabled])").forEach(b => b.onclick = () => {
    b.classList.add("tap"); setTimeout(() => { LESSON = LESSONS[+b.dataset.k]; xp = 0; testScore = 0; i = 0; mode = "motiv"; render(); }, 260);
  });
  $.querySelectorAll("button.place:not([disabled])").forEach(b => b.onclick = () => showPlace(+b.dataset.p));
  const focus = $.querySelector(".node.unlock") || $.querySelector(".node.cur");
  if (focus) setTimeout(() => focus.scrollIntoView({ behavior: "smooth", block: "center" }), 120);
  if (unlockK !== null) setTimeout(() => { unlockK = null; }, 50);
}

function matchStep(s, total) {
  const left = shuffle(s.pairs.map((p, n) => ({ n, v: p[0] })));
  const right = shuffle(s.pairs.map((p, n) => ({ n, v: p[1] })));
  $.innerHTML = header(i, total) + `<h2>${s.q}</h2>
    <div class="opts g2">
      <div class="opts">${left.map(x => `<button class="o" data-side="l" data-n="${x.n}">${x.v}</button>`).join("")}</div>
      <div class="opts">${right.map(x => `<button class="o" data-side="r" data-n="${x.n}">${x.v}</button>`).join("")}</div>
    </div>
    <div class="fb" id="fb"></div>
    <button class="main" id="next" disabled>Juftlang</button>`;
  let sel = null, left2 = s.pairs.length, mistakes = 0;
  $.querySelectorAll("button.o").forEach(b => b.onclick = () => {
    if (!sel || sel.dataset.side === b.dataset.side) {
      $.querySelectorAll(`button.o[data-side="${b.dataset.side}"]`).forEach(x => x.classList.remove("sel"));
      b.classList.add("sel"); sel = b; return;
    }
    if (sel.dataset.n === b.dataset.n) {
      [sel, b].forEach(x => { x.classList.remove("sel"); x.classList.add("done"); });
      if (--left2 === 0) feedback(mistakes === 0, "Xatolar bilan juftlandi — keyingi safar diqqat!");
    } else {
      mistakes++; b.classList.add("bad"); const s0 = sel;
      setTimeout(() => { b.classList.remove("bad"); s0.classList.remove("sel"); }, 500);
    }
    sel = null;
  });
}

// Diktant: ustoz ovozi (audio/diktN-K.mp3, bo'lmasa sintez) — o'quvchi harf bo'laklaridan so'zni pazl kabi yig'adi
const bolak = w => w.replace(/\s+/g, "").match(/.[ً-ٰٟۖ-ۭ]*/gu) || [];
function diktStep(s, total) {
  const parts = bolak(s.w);
  // jami 20 ta bo'lak: so'zning bo'laklari + qolgani tasodifiy harakatli harflar (chalg'ituvchi)
  const HAR = ["َ", "ِ", "ُ", "ْ"], extra = [];
  while (parts.length + extra.length < 20) extra.push({ v: HARF27[Math.floor(Math.random() * HARF27.length)] + HAR[Math.floor(Math.random() * 4)], n: -1 });
  const tiles = shuffle([...parts.map((v, n) => ({ v, n })), ...extra]);
  $.innerHTML = header(i, total) + `<h2>${s.q}</h2>
    <button class="play" id="pl">🔊</button>
    <div class="big ar" id="yig" style="min-height:64px;border-bottom:2px dashed var(--gold,#c9a227)"></div>
    <div id="tl" style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:rtl;margin-top:12px">${tiles.map((t, k) => `<button class="o ar" data-k="${k}" style="width:64px;height:64px;padding:0;font-size:30px">${t.v}</button>`).join("")}</div>
    <button class="o" id="del" style="margin-top:6px">⌫ Oxirgisini o'chirish</button>
    <div class="fb" id="fb"></div>
    <button class="main" id="next" disabled>Tekshirish</button>`;
  const play = () => { const a = new Audio("audio/" + s.audio + ".m4a");  // ustoz ovozi (Telegram ovozli xabari -> m4a, iPhone ham o'qiydi)
    a.onerror = () => tts(s.w); a.play().catch(() => tts(s.w)); };
  document.getElementById("pl").onclick = play; setTimeout(play, 300);
  const yig = document.getElementById("yig"), nx = document.getElementById("next"), picked = [];
  const draw = () => { yig.textContent = picked.map(k => tiles[k].v).join(""); nx.disabled = !picked.length; };
  $.querySelectorAll("#tl button").forEach(b => b.onclick = () => { picked.push(+b.dataset.k); b.disabled = true; b.style.opacity = .3; draw(); });
  document.getElementById("del").onclick = () => { const k = picked.pop(); if (k == null) return; const b = $.querySelector(`#tl button[data-k="${k}"]`); b.disabled = false; b.style.opacity = 1; draw(); };
  nx.onclick = () => {
    $.querySelectorAll("#tl button, #del").forEach(b => b.disabled = true);
    const ok = picked.map(k => tiles[k].v).join("") === parts.join("");
    if (ok) testScore++;
    feedback(ok, "To'g'risi: " + s.w);
  };
}

function next() {
  i++;
  if (mode === "steps" && i >= LESSON.steps.length) { mode = "testIntro"; }
  else if (mode === "test" && i >= LESSON.test.length) {
    sendResult({ lesson: LESSON.n + " (test tugadi " + VERSION + ")", score: testScore, xp });

function finish() {
  const today = new Date().toDateString(), last = store.get("lastDay", null);
  let streak = store.get("streak", 0);
  if (last !== today) {
    const y = new Date(Date.now() - 864e5).toDateString();
    streak = last === y ? streak + 1 : 1;
    store.set("streak", streak); store.set("lastDay", today);
  }
  store.set("xp", store.get("xp", 0) + xp);
  store.set("lesson" + LESSON.n, { score: testScore, xp, at: Date.now() });
  const sent = sendResult({ lesson: LESSON.n, score: testScore, xp, totalXp: store.get("xp", 0), streak });
  const nextL = LESSONS[LESSONS.indexOf(LESSON) + 1];
  const balli = LESSON.test.filter(x => x.t !== "open").length;
  const st = starsOf(testScore, balli), k0 = LESSONS.indexOf(LESSON);
  if (nextL) unlockK = k0 + 1;
  stage = BOSQICHLAR.findIndex(b => k0 + (nextL ? 1 : 0) < b.to); if (stage < 0) stage = BOSQICHLAR.length - 1;
  $.innerHTML = `<div class="win">
      <div class="bigstars">${[0, 1, 2].map(s => `<span class="${s < st ? "on" : ""}" style="animation-delay:${.35 + s * .35}s">★</span>`).join("")}</div>
      <h1>${["Yaxshi boshlanish!", "Ajoyib!", "Mukammal!"][st - 1]}</h1>
      <p>${LESSON.title}</p></div>
    <div class="stats">
      <div class="stat"><b>${testScore}/${balli}</b>test</div>
      <div class="stat"><b>⭐ ${xp}</b>XP</div>
      <div class="stat"><b>🔥 ${streak}</b>kun</div>
    </div>
    <p><b>Uyga vazifa:</b> ${LESSON.hw}</p>
    ${nextL ? `<p>Ertaga: <b>${nextL.title}</b></p>` : ""}
    <button class="main" id="go">${nextL ? "Keyingi bosqichni ochish ➜" : "Xaritaga qaytish"}</button>
    <p style="opacity:.5;font-size:12px">${VERSION} · ${sent ? "natija yuborildi ✓" : "natija yuborilmadi ✗"}</p>`;
  setTimeout(() => confetti(), 300);
  try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success"); } catch {}
  document.getElementById("go").onclick = () => { mode = "home"; render(); };
}

// Dars o'rtasida ilova yopilsa ham shu joydan davom etsin

const MOTIV_ALL = Object.values(MOTIV);
function motiv() {
  const num = +(LESSON.title.match(/^(\d+)-dars/) || [])[1] || 0;

  $.innerHTML = `<div class="top"><button class="hback" id="back">←</button><span style="flex:1"></span></div>
    <div class="motiv"><div class="mq ar">❝</div><p class="mtext">${q}</p><div class="mauth">— Habibulloh Ahmadov</div></div>
    <p style="text-align:center;margin:14px 0 4px">${LESSON.title}</p>
    <button class="main" id="go">${LESSON.exam ? "Imtihonni boshlash ➜" : "Darsni boshlash ➜"}</button>`;
  document.getElementById("go").onclick = () => { if (LESSON.exam) { mode = "test"; i = 0; testScore = 0; } else mode = "intro"; render(); };
}function render() {
  savePos();
  document.body.classList.toggle("examMode", !!(LESSON && LESSON.exam) && mode !== "home");
  document.body.classList.toggle("lvScreen", mode === "home" && level === null && stage === null);
  document.body.classList.toggle("qMode", mode === "steps" || mode === "test");
  const lvNow = mode === "home" ? (level >= 1 ? DARAJALAR[level].id : null) : (LESSON && LESSON.a1 ? "A1" : LESSON && LESSON.lv) || null;
  // daraja ichidagi fon: davlatning eng tanish joyi (Petra, Umaviylar masjidi, Malviya, Burj Xalifa)
  const LVFOTO = { A1: 55, A2: 86, B1: 119, B2: 147, C1: 182, C2: 206 }, fk = LVFOTO[lvNow];
  const fsrc = lvNow === "C2" ? "img/fon-c2.jpg" : fk && AI[fk];  // C2: arab dunyosi bo'ylab chizilgan vertikal fon
  document.body.classList.toggle("lvFoto", !!fsrc);
  if (fsrc) document.body.style.setProperty("--lvfoto", `url(${fsrc})`);
  document.body.classList.toggle("lvA1", !!lvNow);
  ["A1","A2","B1","B2","C1","C2"].forEach(id => document.body.classList.toggle("lv-" + id, lvNow === id));
  document.body.classList.toggle("lv-PRE", mode === "home" ? level === 0 : !!(LESSON && LESSONS.indexOf(LESSON) < PRE_N));
  if (mode === "home") return home();
  if (mode === "motiv") return motiv();
  if (mode === "intro") return intro();
  if (mode === "testIntro") return testIntro();
  if (mode === "finish") return finish();
  if (mode === "test") {
    const s = LESSON.test[i];
    if (s.t === "open") return openStep(s, LESSON.test.length);
    if (s.t === "dikt") return diktStep(s, LESSON.test.length);
    if (s.t === "sifat") return sifatStep(s, LESSON.test.length);
    if (s.t === "maxraj") return maxrajStep(s, LESSON.test.length);
    return choiceStep(s, LESSON.test.length, true);
  }
  const s = LESSON.steps[i], total = LESSON.steps.length;
  if (s.t === "match") return matchStep(s, total);
  if (s.t === "write") return writeStep(s, total);
  return choiceStep(s, total, false);
}
loadCloud(() => { restorePos(); render(); });

    if (m && +m[1].slice(1) > +VERSION.slice(1)) location.replace(location.pathname + "?v=" + m[1].slice(1));
  }).catch(() => {});
