  ["рџЊ™","Luksor ibodatxonasi","Luksor shahrining qoq markazidagi bu ibodatxona taxminan 3400 yil oldin qurilgan. Uni Karnak bilan qariyb 3 km uzunlikdagi sfinkslar xiyoboni bog'laydi. Kechasi ibodatxona chiroqlar bilan yoritiladi va ayniqsa go'zal ko'rinadi. Ibodatxona hovlisida keyinchalik qurilgan Abul-Hajjoj masjidi ham bor."],
  ["рџ—ї","Abu Simbel","Ramzes II davrida qoyaga o'yib qurilgan ikki ulkan ibodatxona. Kirish oldida fir'avnning 20 metrlik to'rtta haykali o'tiradi. 1960-yillarda Asuan to'g'oni qurilganda ibodatxonalar suv ostida qolmasligi uchun 1000 dan ortiq bo'lakka kesilib, balandroq joyga ko'chirilgan. Yiliga ikki marta quyosh nuri ichkaridagi haykallarni yoritadi."],
  ["в›µ","Asuan","Asuan вЂ” Misrning janubidagi, Nil bo'yidagi go'zal shahar. Qadimda bu yerdan ehrom va obelisklar uchun qizil granit qazib olingan. Shahar yaqinidagi Asuan to'g'oni Nil suvini to'sib, ulkan Nosir ko'lini hosil qilgan. Nil bo'ylab hanuz feluka deb ataladigan oq yelkanli qayiqlar suzib yuradi."],
  ["рџЏќпёЏ","Fila ibodatxonasi","Fila ibodatxonasi dastlab Nil o'rtasidagi Fila orolida qurilgan edi. To'g'onlar qurilgach, orol suv ostida qola boshladi. 1970-yillarda xalqaro yordam bilan ibodatxona toshma-tosh ajratilib, yaqindagi baland Agilkiya oroliga ko'chirildi. Unga hozir faqat qayiqda borish mumkin."],
  ["рџЊЉ","Nil daryosi","Nil вЂ” dunyodagi eng uzun daryolardan biri, uzunligi qariyb 6650 km. U 11 ta davlat hududidan oqib o'tadi va O'rta yer dengiziga quyiladi. Misr aholisining deyarli hammasi shu daryo bo'yida yashaydi вЂ” atrofi esa cho'l. Qadimgi tarixchi Gerodot Misrni В«Nil sovg'asiВ» deb atagan."],
  ["рџ—ј","Iskandariya mayog'i","Iskandariya mayog'i miloddan avvalgi 3-asrda Faros orolida qurilgan va qadimgi dunyoning 7 mo'jizasidan biri bo'lgan. Uning balandligi 100 metrdan oshgani aytiladi. Mayoq zilzilalardan vayron bo'lgach, 15-asrda uning o'rnida Qoytboy qal'asi qurilgan вЂ” suratlarda o'sha qal'a."],
  ["рџ“љ","Iskandariya kutubxonasi","Qadimgi Iskandariya kutubxonasi o'z davridagi eng katta kutubxona bo'lib, unda yuz minglab qo'lyozma saqlangan. U zamonlar o'tib yo'qolib ketgan. Uning xotirasiga 2002-yilda dengiz bo'yida yangi ulkan kutubxona ochildi. Uning devorlariga dunyoning turli yozuvlaridagi harflar o'yib yozilgan."],
  ["рџЏ°","Qohira В· Salohiddin qal'asi","Bu qal'ani 12-asrda salibchilardan himoya qilish uchun Salohiddin Ayyubiy qurdirgan. Qal'a Muqattam tepaligida joylashgan va undan butun Qohira ko'rinadi. Taxminan 700 yil davomida Misr hukmdorlarining qarorgohi bo'lgan. Ichida bir nechta masjid va muzeylar bor."],
  ["рџ•Њ","Muhammad Ali masjidi","Qal'a ichidagi bu masjid 19-asrda Usmonli uslubida qurilgan. Devorlari oq alebastr tosh bilan qoplangani uchun uni В«alebastr masjidВ» deb ham atashadi. Ulkan gumbazi va ikki ingichka minorasi Qohiraning ramzlaridan biriga aylangan. Hovlisida Fransiya qiroli sovg'a qilgan soat minorasi bor."],
  ["рџЊЂ","Ibn Tulun masjidi","879-yilda qurilgan bu masjid Qohiradagi asl holicha saqlangan eng qadimgi masjidlardan biri. Uning hovlisi juda keng вЂ” qariyb 2,5 gektar. Minorasiga tashqi tomondan aylanib ko'tariladigan zina bor, bu Samarradagi spiral minoraga o'xshatib qurilgan. Masjid g'isht va ganchdan bezatilgan."],
  ["рџЏ®","Xon al-Xalili bozori","Bu bozor 14-asrda karvonsaroy sifatida qurilgan va o'shandan beri savdo to'xtamagan. Tor ko'chalarida mis buyumlar, fonarlar, ziravorlar, atirlar va gilamlar sotiladi. Bozor ichidagi eski choyxonalar asrlar davomida shoir va yozuvchilar yig'iladigan joy bo'lgan. Qohiraning eng jonli joylaridan biri."],
  ["рџЊґ","Siva vohasi","Siva вЂ” Misr g'arbidagi, Liviya chegarasiga yaqin cho'l vohasi. Bu yerda tuzli ko'llar, issiq buloqlar va minglab xurmo daraxtlari bor. Eski shahar uylari tuz va loy aralashmasidan qurilgan. Rivoyatlarga ko'ra, Iskandar Zulqarnayn bu yerdagi qadimiy Amun ibodatxonasiga kelgan."],
  ["рџЌ„","Oq cho'l","Oq cho'l Farafra vohasi yaqinida joylashgan. Bu yerdagi bo'r qoyalarni million yillar davomida shamol o'yib, qo'ziqorin, tovuq va muz haykallariga o'xshatib qo'ygan. Qadimda bu joy dengiz tubi bo'lgan, shuning uchun qoyalar oppoq. Kechasi oy nurida cho'l qordek yarqiraydi."],
  ["в›°пёЏ","Sinay tog'i","Sinay yarim orolidagi bu tog' Muso alayhissalomga vahiy kelgan joy sifatida tanilgan. Balandligi qariyb 2285 metr. Ziyoratchilar tunda yo'lga chiqib, tongda cho'qqidan quyosh chiqishini kuzatishadi. Tog' etagida qadimiy Avliyo Yekaterina monastiri bor."],
  ["рџђ ","Qizil dengiz marjonlari","Qizil dengiz dunyodagi eng sho'r va iliq dengizlardan biri. Uning tubida rang-barang marjon riflari, minglab tur baliq va dengiz toshbaqalari yashaydi. Sinayning janubidagi Ras Muhammad qo'riqxonasi dunyodagi eng go'zal sho'ng'in joylaridan hisoblanadi."],
  ["рџљў","Suvaysh kanali","1869-yilda ochilgan bu kanal O'rta yer dengizini Qizil dengiz bilan bog'laydi. Uning uzunligi qariyb 193 km. Kanal tufayli Yevropa va Osiyo orasida qatnovchi kemalar Afrikani aylanib o'tmaydi вЂ” yo'l minglab kilometr qisqaradi. Bugun dunyo savdosining katta qismi shu kanal orqali o'tadi."],
  ["рџЄЁ","Rashid toshi","Bu tosh 1799-yilda Rashid shahrida topilgan. Unga bitta matn uch xil yozuvda вЂ” qadimgi Misr iyerogliflarida, demotik yozuvda va yunon tilida yozilgan. Yunoncha matn yordamida fransuz olimi Shampolyon 1822-yilda iyerogliflarni o'qishni kashf qildi. Tosh hozir Londondagi Britaniya muzeyida saqlanadi."],
  // --- 2-bosqich: YAMAN (23) ---
  ["рџЏпёЏ","Sano В· eski shahar","Sano вЂ” dunyodagi eng qadimgi uzluksiz yashab kelinayotgan shaharlardan biri, unda 2500 yildan beri odamlar yashaydi. Eski shahardagi 6000 ga yaqin uy loy g'isht va toshdan, ko'p qavatli qilib qurilgan. Deraza va devorlari oq gips naqshlar bilan bezatilgan. Eski shahar UNESCO ro'yxatiga kiritilgan."],
  ["рџ•Њ","Sano В· Buyuk masjid","Bu masjid islomning ilk davrida, Payg'ambarimiz п·є hayotlik chog'larida qurilgan deb rivoyat qilinadi. U dunyodagi eng qadimgi masjidlardan biri hisoblanadi. 1970-yillarda uning shiftidan Qur'onning eng qadimgi qo'lyozmalaridan bo'lgan sahifalar topilgan."],
  ["рџЏ™пёЏ","Shibam","Shibam вЂ” В«Cho'l ManxetteniВ». Shahar 16-asrda devor bilan o'ralib, ichida 500 ga yaqin 5вЂ“11 qavatli loy uy qurilgan. Bu uylar dunyodagi loydan qurilgan eng qadimgi В«osmono'parВ»lar hisoblanadi. Uylarni yomg'ir yuvib ketmasligi uchun aholi ularni har yili yangi loy bilan suvaydi."],
  ["рџЊі","Sokotra В· ajdar daraxti","Ajdar qoni daraxti soyabonga o'xshab o'sadi вЂ” shoxlari tepaga qarab ochilgan. Uning qizil shirasi qadimdan bo'yoq va dori sifatida ishlatilgan. Sokotra oroli asrlar davomida quruqlikdan ajralib turgani uchun bu yerdagi o'simliklarning uchdan biri dunyoning boshqa hech bir joyida o'smaydi."],
  ["рџЊё","Sokotra В· cho'l atirguli","Bu daraxtning tanasi shishadek yo'g'on вЂ” u ichida suv to'playdi va qurg'oqchilikda shu suv bilan yashaydi. Qoyalarga yopishib o'sadi, ustida pushti gullar ochiladi. Sokotraga xos bu tur faqat shu orolda uchraydi."],
  ["рџ’§","Ma'rib to'g'oni","Qadimgi Saba davlati miloddan avvalgi 8-asr atrofida ulkan to'g'on qurib, cho'lni bog'-rog'ga aylantirgan. To'g'on taxminan 1000 yildan ortiq ishlagan. Milodiy 6-asrda u buzilib, aholi tarqalib ketgan. Bu voqea вЂ” Saba qissasi вЂ” Qur'oni karimda ham zikr qilingan."],
  ["рџ‘‘","Ma'rib В· Bilqis ibodatxonasi","В«Mahram BilqisВ» вЂ” Saba malikasi nomi bilan ataladigan qadimiy ibodatxona xarobalari. Undan qumdan chiqib turgan sakkizta baland tosh ustun saqlanib qolgan. Qur'onda Sulaymon alayhissalom va Saba malikasi qissasi bayon qilingan."],
  ["рџЏњпёЏ","Hadramavt vodiysi","Hadramavt вЂ” Yaman sharqidagi uzun va keng vodiy. Bu yerda asrlar davomida Shibam, Seyun, Tarim kabi loydan qurilgan shaharlar rivojlangan. Hadramavtliklar savdo bilan Indoneziya, Malayziya va Sharqiy Afrikagacha borgan va u yerlarda islomning tarqalishiga hissa qo'shgan."],
  ["рџ“–","Tarim","Tarim вЂ” Hadramavtning ilm shahri, unda 300 dan ortiq masjid borligi aytiladi. Shahar asrlar davomida olimlar va ilm talabalari markazi bo'lgan. Loydan qurilgan Al-Mihdhor masjidi minorasi 50 metrga yaqin ko'tariladi вЂ” u loydan qurilgan eng baland minoralardan biri."],
  ["рџЏЇ","Seyun saroyi","Seyun shahridagi bu ulkan oppoq saroy Kasiriy sultonlarining qarorgohi bo'lgan. U to'liq loy g'ishtdan qurilgan va ohak bilan oqlangan. Hozir saroyda muzey joylashgan bo'lib, unda Hadramavt tarixiga oid buyumlar saqlanadi."],
  ["рџЋ“","Zabid","Zabid вЂ” Yamanning g'arbiy qismidagi qadimiy shahar. 13вЂ“15-asrlarda u islom olamidagi mashhur ilm markazlaridan biri bo'lgan, bu yerda 80 dan ortiq madrasa ishlagan. Shaharning eski qismi UNESCO ro'yxatiga kiritilgan."],
  ["рџЊ‹","Adan","Adan shahrining eski qismi so'ngan vulqon krateri ichida joylashgan, shuning uchun uni В«KraterВ» deb ham atashadi. Shahar qadimdan Hindiston, Afrika va Arabistonni bog'lovchi muhim dengiz porti bo'lgan. Tog' yonbag'ridagi qadimiy suv havzalari yomg'ir suvini to'plash uchun qurilgan."],
  ["рџЏ–пёЏ","Mukalla","Mukalla вЂ” Arab dengizi bo'yidagi port shahar. Uning oppoq uylari qoyali tog'larga suyanib, dengizga qarab turadi. Shahar baliqchilik va savdo bilan mashhur, Hadramavtning dengiz darvozasi hisoblanadi."],
  ["рџЏ°","Dor al-Hajar","В«Tosh saroyВ» Sano yaqinidagi Vodiy Dahr'da, ulkan qoya ustiga qurilgan. Saroy besh qavatli bo'lib, qoya bilan bir butun bo'lib ketgandek ko'rinadi. 20-asrda u imom Yahyoning yozgi qarorgohi bo'lgan. Bugun Yamanning eng mashhur ramzlaridan biri."],
  ["рџЊї","Ibb","Ibb вЂ” Yamanning eng ko'p yomg'ir yog'adigan viloyati, shuning uchun uni В«Yashil viloyatВ» deyishadi. Tog' yonbag'irlari zina-zina dalalar bilan qoplangan. Bu yerda bug'doy, qahva va mevalar yetishtiriladi."],
  ["рџ‘ё","Jibla","Jibla вЂ” Ibb yaqinidagi qadimiy shahar. 11-asrda bu yerdan adolatli malika Arvo Yamanni qariyb 50 yil boshqargan. U ilm, yo'l va masjidlar qurilishiga katta e'tibor bergan. Uning nomi bilan atalgan masjid va maqbara hanuz shaharda turibdi."],
  ["в›°пёЏ","Kavkaban","Kavkaban вЂ” baland tog' cho'qqisiga qurilgan qadimiy qishloq. Qadimda u dushmanlardan himoyalanish uchun qal'a vazifasini o'tagan. Cho'qqidan pastdagi Shibam (Kavkaban) shahri va butun vodiy ko'rinadi."],
  ["рџЊ„","Haraz tog'lari","Haraz вЂ” Sano va Hudayda orasidagi baland tog'lar. Tog' yonbag'irlari zina-zina dalalarga aylantirilgan, cho'qqilarida tosh qishloqlar joylashgan. Bu yerda dunyodagi eng qadimgi qahva navlaridan biri yetishtiriladi."],
  ["в•","Moxa","Moxa вЂ” Qizil dengiz bo'yidagi port shahar. 15вЂ“17-asrlarda dunyodagi deyarli barcha qahva shu port orqali sotilgan. Shuning uchun Yevropada qahva В«mokkoВ» deb atalgan вЂ” bugungi В«mokachinoВ» so'zi ham shundan. Yamanda qahva ichish odati 15-asrdan beri ma'lum."],
  ["рџЏ°","Taiz В· Al-Qohira qal'asi","Bu qal'a Sabir tog'i yonbag'rida, Taiz shahri ustida qad ko'targan. U asrlar davomida shaharni himoya qilib kelgan. Qal'adan butun Taiz shahri ko'rinadi."],
  ["рџЊЉ","Bob al-Mandab","Bob al-Mandab вЂ” Qizil dengizni Adan ko'rfazi bilan bog'laydigan bo'g'oz, Arabiston va Afrika orasida joylashgan. Uning nomi В«Ko'z yoshlar darvozasiВ» degani вЂ” qadimda bu yerdan suzish xavfli bo'lgan. Bugun dunyodagi eng gavjum dengiz yo'llaridan biri."],
  ["рџЊ‰","Shahara ko'prigi","Bu tosh ko'prik 17-asrda Shahara tog'idagi ikki qishloqni bog'lash uchun chuqur dara ustiga qurilgan. Ko'prikning uzunligi 20 metrga yaqin, ostida yuz metrlab chuqurlik bor. U Yaman me'morlarining mahoratini ko'rsatuvchi noyob inshoot."],
  ["рџЌЇ","Sidr asali","Sidr (konor) daraxti gullaridan olinadigan Yaman asali dunyodagi eng qadrli asallardan biri. Asalarichilar qutilarni sidr daraxtlari gullagan vodiylarga ko'chirib yuradi. Bu asal shifobaxsh xususiyatlari bilan mashhur va juda qimmat turadi."],
  // --- 1-bosqich davomi: MISR (24вЂ“27-darslar va imtihon) ---
  ["рџЏ›пёЏ","Kom Ombo ibodatxonasi","Nil bo'yidagi bu ibodatxona qo'sh qurilgan: ikki xil ilohga bag'ishlangan ikki eshik va ikki zal yonma-yon turadi. Qadimda bu yerda Nil timsohlari muqaddas sanalgan, shuning uchun ibodatxona yonida mumiyolangan timsohlar muzeyi bor."],
  ["рџ¦…","Edfu ibodatxonasi","Edfu вЂ” Misrdagi eng yaxshi saqlangan qadimiy ibodatxonalardan biri. U miloddan avvalgi 237вЂ“57-yillarda qurilgan. Kirish oldida granitdan yasalgan ulkan lochin haykali turibdi, devorlari esa yozuvlarga to'la."],
  ["вњЁ","Dendera ibodatxonasi","Dendera ibodatxonasining shiftlaridagi ranglar ming yillar o'tsa ham saqlanib qolgan. Bu yerdan mashhur В«Dendera zodiakiВ» вЂ” osmon yulduzlari tasvirlangan tosh topilgan, uning asli hozir Parijdagi Luvr muzeyida."],
  ["рџ•Њ","Sulton Hasan masjidi","14-asrda qurilgan bu masjid-madrasa Qohiradagi eng ulkan mamluk inshootlaridan biri. Uning to'rt tomonida to'rt mazhab uchun alohida dars ayvonlari bo'lgan. Eshigi balandligi 38 metrga yaqin."],
  ["рџ—ј","Qohira minorasi","1961-yilda qurilgan 187 metrlik minora Nil o'rtasidagi Gezira orolida turibdi. Uning sirti lotos guli shaklida to'r bilan qoplangan. Tepasidan butun Qohira va havo ochiq kunlari Giza ehromlari ham ko'rinadi."],
  // --- A1: IORDANIYA (35) ---
  ["рџЏ›пёЏ","Amman qal'asi","Amman markazidagi Jabal al-Qal'a tepaligida 7000 yildan beri odamlar yashab kelgan. Bu yerda Rim davridagi Gerkules ibodatxonasi ustunlari va Umaviylar saroyi xarobalari bor. Tepalikdan butun Amman shahri ko'rinadi."],
  ["рџЋ­","Amman В· Rim teatri","2-asrda qurilgan bu teatr 6000 ga yaqin tomoshabinni sig'dirgan. U tog' yonbag'riga o'yib qurilgan, shuning uchun kun bo'yi soya tushib turadi. Hozir ham bu yerda konsert va tadbirlar o'tkaziladi."],
  ["рџ•Њ","Qirol Abdulla I masjidi","Ammandagi bu masjid 1989-yilda qurilgan va ko'k mozaikali ulkan gumbazi bilan mashhur. Gumbaz ostida bir vaqtda 3000 ga yaqin kishi namoz o'qiy oladi. Masjid yonida kichik islom muzeyi bor."],
  ["рџЊ€","Amman В· Rangli zinapoyalar","Ammanning eski mahallalarida ko'p qavatli zinapoyalar rang-barang qilib bo'yalgan. Shahar yetti tepalik ustida qurilgani uchun bunday zinalar juda ko'p. Ular yoshlar va sayyohlar sevgan joyga aylangan."],
  ["рџЏњпёЏ","Petra В· Al-Xazna","В«XazinaВ» deb ataladigan bu bino 2000 yildan ko'proq oldin nabatiylar tomonidan qizil qoyaga o'yib yasalgan. Uning balandligi 40 metrga yaqin. Petra dunyoning yangi 7 mo'jizasidan biri hisoblanadi."],
  ["в›°пёЏ","Petra В· Ad-Deyr","В«MonastirВ» deb nomlanadigan bu ulkan bino Xaznadan ham kattaroq. Unga yetib borish uchun 800 dan ortiq tosh zinapoyadan ko'tarilish kerak. Tepadan Vodiy Araba manzarasi ochiladi."],
  ["рџЄЁ","Petra В· As-Siq","Siq вЂ” Petraga olib kiradigan 1,2 km uzunlikdagi tor dara. Ba'zi joylarda devorlar 80 metrgacha ko'tariladi, kengligi esa 3 metrga tushadi. Daraning oxirida birdan Xazna ko'rinadi."],
  ["рџЊ„","Vodiy Rum","В«Oy vodiysiВ» deb ataladigan qizil qumli cho'l. Ulkan qumtosh qoyalar va tog'lar ming yillar davomida shamol ta'sirida o'yilgan. Bu yerda Mars haqidagi ko'plab filmlar suratga olingan."],
  ["рџЊЉ","O'lik dengiz","O'lik dengiz yer yuzining eng past nuqtasi вЂ” dengiz sathidan 430 metr pastda. Suvi juda sho'r, shuning uchun odam unda cho'kmay, suv ustida yotib turadi. Uning loyi shifobaxsh hisoblanadi."],
  ["рџђ ","Aqaba","Aqaba вЂ” Iordaniyaning Qizil dengizdagi yagona porti. Uning iliq suvlarida rang-barang marjon riflari va baliqlar ko'p. Shahar qadimdan savdo va haj yo'lida joylashgan."],
  ["рџЏ›пёЏ","Jerash В· Oval maydon","Jerash вЂ” dunyodagi eng yaxshi saqlangan Rim shaharlaridan biri. Uning oval shaklidagi maydoni atrofida 160 ga yaqin ustun turibdi. Shaharning ustunli asosiy ko'chasi 800 metrga cho'zilgan."],
  ["рџљЄ","Jerash В· Hadrian darvozasi","Bu tantanali darvoza 129-yilda imperator Hadrian shaharga tashrif buyurganda qurilgan. Uning balandligi 21 metrga yaqin. Darvoza Jerashning kirish ramzi hisoblanadi."],
  ["рџЏ°","Ajlun qal'asi","12-asrda Salohiddin Ayyubiyning sarkardasi tomonidan salibchilardan himoya uchun qurilgan. Qal'a tog' cho'qqisida turadi va undan Iordan vodiysi ko'rinadi. U temir konlarini ham qo'riqlagan."],
  ["рџЏЇ","Karak qal'asi","Karak вЂ” Iordaniyadagi eng katta salibchilar qal'alaridan biri, 1140-yillarda qurilgan. Uning ostida uzun tosh yo'laklar va xonalar bor. 1188-yilda qal'ani Salohiddin qo'shini egallagan."],
  ["в›°пёЏ","Shavbak qal'asi","Bu qal'a 1115-yilda salibchilar tomonidan baland tepalik ustida qurilgan. U Damashqdan Misrga boradigan savdo yo'lini nazorat qilgan. Qal'a ichida yer osti quduqlari saqlanib qolgan."],
  ["рџ—єпёЏ","Madaba В· mozaik xarita","Madabadagi cherkov polida 6-asrga oid mashhur mozaik xarita bor. Unda Quddus, Nil va O'lik dengiz atrofidagi joylar tasvirlangan. Bu hudud xaritalarining eng qadimiylaridan biri."],
  ["рџЏ”пёЏ","Nebo tog'i","Bu tog' Muso alayhissalom bilan bog'liq joy sifatida tanilgan. Cho'qqidan havo ochiq kunlari O'lik dengiz, Iordan vodiysi va Quddus atrofi ko'rinadi. Balandligi 700 metrga yaqin."],
  ["рџЏ›пёЏ","Umm Qays","Shimoliy Iordaniyadagi qadimiy Gadara shahri xarobalari. Undan Tabariya ko'li va Golan tepaliklari ko'rinadi. Shahar qora bazalt toshdan qurilgan teatri bilan mashhur."],

const UZJOY = {
  b0: ["Minorai Kalon", "1127-yilda Arslonxon qurdirgan, balandligi qariyb 46 metr. Asrlar davomida karvonlarga mayoq bo'lgan. Rivoyatga ko'ra, Chingizxon unga qarab bosh egilgan va uni buzdirmagan."],
  b1: ["Ark qal'asi", "Buxoro amirlarining qarorgohi bo'lgan qadimiy qal'a. Uning devorlari shahar ustida tepalikka o'xshab turadi, ichida saroy, masjid va zindon bo'lgan."],
  b2: ["Labi Hovuz", "\"Hovuz bo'yi\" degani. 1620-yilda qazilgan hovuz atrofida madrasa va xonaqoh joylashgan, chetida asrlik tut daraxtlari o'sadi. Buxoroliklarning sevimli dam olish joyi."],
  b3: ["Chor Minor", "\"To'rt minora\" degani. 1807-yilda boy savdogar qurdirgan, har bir minorasi boshqacha bezatilgan вЂ” ular to'rt qizining yoki to'rt dinning ramzi deyiladi."],
  b4: ["Somoniylar maqbarasi", "X asrda qurilgan, O'rta Osiyodagi eng qadimiy saqlangan pishiq g'ishtli binolardan biri. G'ishtlari kun davomida yorug'likka qarab rangini o'zgartirgandek ko'rinadi."],
  b5: ["Mir Arab madrasasi", "XVI asrda qurilgan, ko'k gumbazlari Minorai Kalon yonida turadi. Sovet davrida ham ishlab turgan kam sonli madrasalardan biri."],
  b6: ["Kalon masjidi", "Buxoroning eng katta jome masjidi, hovlisiga 10 mingdan ortiq kishi sig'adi. Atrofida 288 ta gumbaz bor."],
  b7: ["Bolo Hovuz masjidi", "1712-yilda qurilgan. Old ayvonidagi 20 ta baland yog'och ustun hovuz suvida aks etib, 40 ta ustunga o'xshaydi."],
  b8: ["Toqi Zargaron", "\"Zargarlar gumbazi\" вЂ” XVI asrdagi savdo gumbazlaridan biri. Qadimda bu yerda zargarlar ishlagan, hozir ham hunarmandlar o'z buyumlarini sotadi."],
  b9: ["Ulug'bek madrasasi (Buxoro)", "1417-yilda Mirzo Ulug'bek qurdirgan. Eshigiga \"Ilm olish har bir musulmon erkak va ayolga farzdir\" degan hadis yozilgan."],
  b10: ["Chashmai Ayub", "Rivoyatga ko'ra, Ayyub payg'ambar asosini urib, shu yerdan buloq chiqargan. Hozir bu yerda suv muzeyi bor."],
  b11: ["Sitorai Mohi Xosa", "\"Oy va yulduzdek saroy\" вЂ” oxirgi Buxoro amirining yozgi saroyi. Unda Sharq va Yevropa uslublari aralashib ketgan."],
  b12: ["Nodir Devonbegi madrasasi", "Labi Hovuz yonida, peshtoqida quyosh yuzli va oq kiyiklarni changallagan ikki qush tasvirlangan вЂ” bu juda kam uchraydigan bezak."],
  b13: ["Bahouddin Naqshband majmuasi", "Mashhur so'fiy olim Bahouddin Naqshband yotgan joy. \"Dil ba yoru, dast ba kor\" вЂ” \"Qalb Allohda, qo'l ishda\" degan shiori mashhur."],
  b14: ["Magoki Attori masjidi", "Buxorodagi eng qadimiy masjidlardan biri, yer sathidan ancha pastda joylashgan вЂ” chunki asrlar davomida atrofidagi yer ko'tarilib ketgan."],
  s0: ["Registon maydoni", "\"Qumli joy\" degani. Uch ulkan madrasa вЂ” Ulug'bek, Sherdor va Tillakori вЂ” bir maydonga qarab turadi. Samarqandning yuragi."],
  s1: ["Sherdor madrasasi", "1636-yilda qurilgan. Peshtoqida kiyikni quvayotgan sher va quyosh tasvirlangan вЂ” shuning uchun \"Sherdor\" deyiladi."],
  s2: ["Tillakori madrasasi", "\"Tilla bilan bezatilgan\" degani. Ichki masjidining gumbazi va devorlari oltin suvi bilan bezatilgan."],
  s3: ["Ulug'bek madrasasi (Samarqand)", "1420-yilda qurilgan. Bu yerda Ulug'bekning o'zi falakiyot va matematikadan dars bergan."],
  s4: ["Go'ri Amir", "Amir Temur va uning avlodlari dafn etilgan maqbara. Qovurg'ali ko'k gumbazi butun dunyoga mashhur."],
  s5: ["Bibixonim masjidi", "Amir Temur Hindiston yurishidan keyin qurdirgan ulkan jome masjid. O'z davrida dunyodagi eng katta masjidlardan biri bo'lgan."],
  s6: ["Shohi Zinda", "\"Tirik shoh\" degani. Ko'k koshinlar bilan bezatilgan maqbaralar ko'chasi вЂ” dunyodagi eng chiroyli koshinkorlik namunalaridan biri."],
  s7: ["Ulug'bek rasadxonasi", "1420-yillarda qurilgan. Bu yerda Ulug'bek 1018 ta yulduzning o'rnini aniqlagan, yil uzunligini juda aniq hisoblagan."],
  s8: ["Siyob bozori", "Samarqandning eng katta va qadimiy bozori. Mashhur Samarqand noni, quritilgan mevalar va shirinliklar shu yerda sotiladi."],
  s9: ["Afrosiyob", "Qadimiy Samarqand shahrining xarobalari, 2500 yildan ortiq tarixga ega. Muzeyida VII asrga oid devoriy rasmlar saqlanadi."],
  s10: ["Hazrati Xizr masjidi", "Afrosiyob tepaligida joylashgan, shaharning eng qadimiy masjid joylaridan biri. O'ymakor yog'och ustunli ayvoni bor."],
  s11: ["Imom Buxoriy majmuasi", "Hadis ilmining buyuk olimi Imom Buxoriy shu yerda dafn etilgan. U yozgan \"Sahihi Buxoriy\" eng ishonchli hadis kitobi hisoblanadi."],
  s12: ["Ruhobod maqbarasi", "XIV asrda qurilgan, Samarqanddagi eng qadimiy saqlangan binolardan biri. Uning ichida payg'ambar sochi saqlangan, deyiladi."],
  s13: ["Oqsaroy maqbarasi", "Go'ri Amir yaqinidagi temuriylar maqbarasi. Ichki gumbazi oltin naqshlar bilan bezatilgan."],
  s14: ["Konigil qog'oz ustaxonasi", "Bu yerda Samarqand qog'ozi hali ham qadimiy usulda tut po'stlog'idan qo'lda tayyorlanadi. Samarqand qog'ozi bir paytlar dunyoga mashhur bo'lgan."],
  s15: ["Doniyor maqbarasi", "Rivoyatga ko'ra, Doniyor payg'ambar shu yerda yotadi. Maqbara 18 metr uzunlikda bo'lib, tepalik ustida joylashgan."],
  x0: ["Ichan qal'a", "Xivaning devor bilan o'ralgan ichki shahri. Ichida 50 dan ortiq tarixiy bino bor вЂ” butun shahar ochiq osmon ostidagi muzeyga o'xshaydi."],
  x1: ["Kalta Minor", "Muhammad Aminxon dunyodagi eng baland minorani qurmoqchi bo'lgan, lekin xon vafot etib, minora chala qolgan. Shuning uchun \"kalta\" deyiladi."],
  x2: ["Islomxo'ja minorasi", "Xivaning eng baland minorasi, 57 metr. Tepasiga chiqsangiz, butun shahar kaftingizdagidek ko'rinadi."],
  x3: ["Juma masjidi", "Tomi 213 ta o'ymakor yog'och ustunga tayangan. Ba'zi ustunlar 1000 yildan ortiq qadimiy."],
  x4: ["Ko'hna Ark", "Xiva xonlarining qarorgohi. Ichida taxtxona, masjid, zarbxona va qorovulxona bo'lgan."],
  x5: ["Pahlavon Mahmud maqbarasi", "Xivaning homiysi вЂ” shoir va polvon Pahlavon Mahmud dafn etilgan joy. Ko'k gumbazi shaharning eng chiroyli gumbazlaridan."],
  x6: ["Toshhovli saroyi", "\"Tosh hovli\" degani. 150 dan ortiq xonasi va 9 ta hovlisi bor, devorlari ko'k-oq koshinlar bilan bezatilgan."],
  x7: ["Muhammad Aminxon madrasasi", "Xivaning eng katta madrasasi, 125 ta hujrasi bor. Hozir uning ichida mehmonxona joylashgan."],
  x8: ["Ota darvoza", "Ichan qal'aning g'arbiy asosiy darvozasi. Sayohatchilar Xivaga ko'pincha shu darvozadan kirishadi."],
  x9: ["Olloqulixon madrasasi", "XIX asrda qurilgan, Ichan qal'a devori yonida turadi. Uning yonida savdo toqi va karvonsaroy bor."],
  x10: ["Nurullaboy saroyi", "Xiva xonlarining so'nggi saroyi, XX asr boshida qurilgan. Unda Sharq va Yevropa bezaklari uyg'unlashgan."],
  x11: ["Dishan qal'a", "Xivaning tashqi shahri. Bir paytlar uning ham uzun devori bo'lgan, bu yerda hunarmandlar va savdogarlar yashagan."],

  b16: ["Toqi Telpakfurushon", "\"Telpak sotuvchilar gumbazi\". Bir paytlar bu yerda do'ppi va telpaklar sotilgan, hozir ham hunarmandlar ishlaydi."],
  b17: ["Abdulazizxon madrasasi", "1652-yilda qurilgan, ichki bezaklari juda boy вЂ” ganch va koshinlarda gullar, bulutlar va hatto qushlar tasvirlangan."],

    $.querySelector("#nx").onclick = () => { if (++i < W.length) card(); else { i = 0; quiz(); } };

    if (t === 2) { $.querySelector("#pl").onclick = () => say(w.ar); setTimeout(() => say(w.ar), 300); }
    $.querySelectorAll(".opts button").forEach(b => b.onclick = () => {
      const ok = o[+b.dataset.k] === w; if (ok) ball++; else Q.push({ w, t });  // xato вЂ” oxirida yana so'raladi

    $.querySelector("#nx").onclick = () => { if (++i < Q.length) quiz(); else tugadi(); };

    store.set(`bolim3-${lv}-${j}`, { ball, n: W.length }); store.set("xp", store.get("xp", 0) + ball);

      <button class="main" id="nx">Lug'atlarga qaytish</button><button class="o" id="yb" style="width:100%;margin-top:10px">Yana bir bor</button>`;

    }).join("")}</div>`}`;
  drawTrail(); setTimeout(ustozYol, 60);

function feedback(ok, extra) {

  fb.className = "fb " + (ok ? "ok" : "bad");
  fb.textContent = ok ? "To'g'ri! +10 XP" : "Noto'g'ri. " + (extra || "");

  if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred(ok ? "success" : "error");
  const btn = document.getElementById("next");
  btn.disabled = false; btn.textContent = "Davom etish";
  btn.onclick = next;
}

function matchStep(s, total) {
  const left = shuffle(s.pairs.map((p, n) => ({ n, v: p[0] })));
  const right = shuffle(s.pairs.map((p, n) => ({ n, v: p[1] })));
  $.innerHTML = header(i, total) + `<h2>${s.q}</h2>
    <div class="opts g2">
      <div class="opts">${left.map(x => `<button class="o" data-side="l" data-n="${x.n}">${x.v}</button>`).join("")}</div>
      <div class="opts">${right.map(x => `<button class="o" data-side="r" data-n="${x.n}">${x.v}</button>`).join("")}</div>
    </div>
    <div class="fb" id="fb"></div>
    <button class="main" id="next" disabled>Juftlang</button>`;
  let sel = null, left2 = s.pairs.length, mistakes = 0;
  $.querySelectorAll("button.o").forEach(b => b.onclick = () => {
    if (!sel || sel.dataset.side === b.dataset.side) {
      $.querySelectorAll(`button.o[data-side="${b.dataset.side}"]`).forEach(x => x.classList.remove("sel"));
      b.classList.add("sel"); sel = b; return;
    }
    if (sel.dataset.n === b.dataset.n) {
      [sel, b].forEach(x => { x.classList.remove("sel"); x.classList.add("done"); });
      if (--left2 === 0) feedback(mistakes === 0, "Xatolar bilan juftlandi вЂ” keyingi safar diqqat!");
    } else {
      mistakes++; b.classList.add("bad"); const s0 = sel;
      setTimeout(() => { b.classList.remove("bad"); s0.classList.remove("sel"); }, 500);
    }
    sel = null;
  });
}

// Diktant: ustoz ovozi (audio/diktN-K.mp3, bo'lmasa sintez) вЂ” o'quvchi harf bo'laklaridan so'zni pazl kabi yig'adi
const bolak = w => w.replace(/\s+/g, "").match(/.[Щ‹-ЩџЩ°Ы–-Ы­]*/gu) || [];
function diktStep(s, total) {
  const parts = bolak(s.w);
  // jami 20 ta bo'lak: so'zning bo'laklari + qolgani tasodifiy harakatli harflar (chalg'ituvchi)
  const HAR = ["ЩЋ", "Щђ", "ЩЏ", "Щ’"], extra = [];
  while (parts.length + extra.length < 20) extra.push({ v: HARF27[Math.floor(Math.random() * HARF27.length)] + HAR[Math.floor(Math.random() * 4)], n: -1 });
  const tiles = shuffle([...parts.map((v, n) => ({ v, n })), ...extra]);
  $.innerHTML = header(i, total) + `<h2>${s.q}</h2>
    <button class="play" id="pl">рџ”Љ</button>
    <div class="big ar" id="yig" style="min-height:64px;border-bottom:2px dashed var(--gold,#c9a227)"></div>
    <div id="tl" style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:rtl;margin-top:12px">${tiles.map((t, k) => `<button class="o ar" data-k="${k}" style="width:64px;height:64px;padding:0;font-size:30px">${t.v}</button>`).join("")}</div>
    <button class="o" id="del" style="margin-top:6px">вЊ« Oxirgisini o'chirish</button>
    <div class="fb" id="fb"></div>
    <button class="main" id="next" disabled>Tekshirish</button>`;
  const play = () => { const a = new Audio("audio/" + s.audio + ".m4a");  // ustoz ovozi (Telegram ovozli xabari -> m4a, iPhone ham o'qiydi)
    a.onerror = () => tts(s.w); a.play().catch(() => tts(s.w)); };
  document.getElementById("pl").onclick = play; setTimeout(play, 300);
  const yig = document.getElementById("yig"), nx = document.getElementById("next"), picked = [];
  const draw = () => { yig.textContent = picked.map(k => tiles[k].v).join(""); nx.disabled = !picked.length; };
  $.querySelectorAll("#tl button").forEach(b => b.onclick = () => { picked.push(+b.dataset.k); b.disabled = true; b.style.opacity = .3; draw(); });
  document.getElementById("del").onclick = () => { const k = picked.pop(); if (k == null) return; const b = $.querySelector(`#tl button[data-k="${k}"]`); b.disabled = false; b.style.opacity = 1; draw(); };
  nx.onclick = () => {
    $.querySelectorAll("#tl button, #del").forEach(b => b.disabled = true);
    const ok = picked.map(k => tiles[k].v).join("") === parts.join("");
    if (ok) testScore++;
    feedback(ok, "To'g'risi: " + s.w);
  };
}

function finish() {
  const today = new Date().toDateString(), last = store.get("lastDay", null);
  let streak = store.get("streak", 0);
  if (last !== today) {
    const y = new Date(Date.now() - 864e5).toDateString();
    streak = last === y ? streak + 1 : 1;
    store.set("streak", streak); store.set("lastDay", today);
  }
  store.set("xp", store.get("xp", 0) + xp);
  store.set("lesson" + LESSON.n, { score: testScore, xp, at: Date.now() });
  const sent = sendResult({ lesson: LESSON.n, score: testScore, xp, totalXp: store.get("xp", 0), streak });
  const nextL = LESSONS[LESSONS.indexOf(LESSON) + 1];
  const balli = LESSON.test.filter(x => x.t !== "open").length + (birTest() ? LESSON.steps.filter(x => x.t !== "match" && x.t !== "write").length : 0);
  const st = starsOf(testScore, balli), k0 = LESSONS.indexOf(LESSON);
  if (nextL) unlockK = k0 + 1;
  stage = BOSQICHLAR.findIndex(b => k0 + (nextL ? 1 : 0) < b.to); if (stage < 0) stage = BOSQICHLAR.length - 1;
  $.innerHTML = `<div class="win">
      <div class="bigstars">${[0, 1, 2].map(s => `<span class="${s < st ? "on" : ""}" style="animation-delay:${.35 + s * .35}s">в…</span>`).join("")}</div>
      <h1>${["Yaxshi boshlanish!", "Ajoyib!", "Mukammal!"][st - 1]}</h1>
      <p>${LESSON.title}</p></div>
    ${k0 < BOSQICHLAR[1].to ? `<div class="kuch"><small>рџЌЏ Harf daraxtingizga yangi meva qo'shildi</small><b>Har kuni bittasi pishadi вЂ” uzib olishni unutmang</b></div>` : ""}
    <div class="kuch" ${k0 < BOSQICHLAR[1].to ? 'style="display:none"' : ""}><small>вљЎ Yangi kuch ochildi</small><b>${LESSON.kuch || `Endi В«${LESSON.title.replace(/^\d+-dars\.\s*/, "")}В» sizga bo'ysunadi`}</b><i>${LESSONS.filter(l => store.get("lesson" + l.n, null)).length}-kuch В· ${LESSONS.length} tadan</i></div>
    <div class="stats">
      <div class="stat"><b>${testScore}/${balli}</b>test</div>
      <div class="stat"><b>в­ђ ${xp}</b>XP</div>
      <div class="stat"><b>рџ”Ґ ${streak}</b>kun</div>
    </div>
    <p><b>Uyga vazifa:</b> ${LESSON.hw}</p>
    ${nextL ? `<p>Ertaga: <b>${nextL.title}</b></p>` : ""}
    <button class="main" id="go">${nextL ? "Keyingi bosqichni ochish вћњ" : "Xaritaga qaytish"}</button>
    <p style="opacity:.5;font-size:12px">${VERSION} В· ${sent ? "natija yuborildi вњ“" : "natija yuborilmadi вњ—"}</p>`;
