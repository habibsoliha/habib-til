# Hobbi — Android ilovasini (AAB + APK) avtomatik yig'ish. Qo'lda ishga tushiriladi: Actions → Android → Run workflow.
# Ilova ichida veb-sahifa (shu repodagi fayllar) Capacitor orqali o'raladi. Imzo kaliti GitHub Secrets'da turadi.
name: Android
on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: "Versiya raqami (har yuklashda +1)"
        required: true
        default: "1"
      versionName:
        description: "Ko'rinadigan versiya"
        required: true
        default: "1.0.0"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: site }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Capacitor loyihasi
        run: |
          mkdir app && cd app
          npm init -y >/dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets@3
          mkdir www && rsync -a --exclude '.git' --exclude '.github' ../site/ www/
          cat > capacitor.config.json <<'EOF'
          { "appId": "uz.habibacademy.hobbi", "appName": "Hobbi", "webDir": "www",
            "android": { "allowMixedContent": false }, "server": { "androidScheme": "https" } }
          EOF
          npx cap add android
          mkdir -p assets && cp www/img/hobbi.png assets/icon-only.png && cp www/img/hobbi.png assets/icon-foreground.png
          printf '#0f6b48' > /dev/null
          npx capacitor-assets generate --android --iconBackgroundColor '#0f6b48' --splashBackgroundColor '#0f6b48' || true
          npx cap sync android
      - name: Versiya va imzo
        working-directory: app/android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KS_B64" | base64 -d > app/upload.p12
          sed -i "s/versionCode [0-9]*/versionCode ${{ inputs.versionCode }}/; s/versionName \"[^\"]*\"/versionName \"${{ inputs.versionName }}\"/" app/build.gradle
          cat >> app/build.gradle <<EOF
          android {
            signingConfigs { release { storeFile file("upload.p12"); storeType "pkcs12"; storePassword System.getenv("KS_PASS"); keyAlias System.getenv("KS_ALIAS"); keyPassword System.getenv("KS_PASS") } }
            buildTypes { release { signingConfig signingConfigs.release } }
          }
          EOF
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon
          rm -f app/upload.p12
      - uses: actions/upload-artifact@v4
        with:
          name: hobbi-${{ inputs.versionName }}
          path: |
            app/android/app/build/outputs/bundle/release/*.aab
            app/android/app/build/outputs/apk/release/*.apk
          retention-days: 14
